<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>25병동 인증 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone-first column — setup card, then a single question card with four answer buttons and a verdict strip. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#152B2A; --muted:#5B6E6C; --line:#D5DFDD;
  --accent:#1F5F66; --accent-soft:#E3EFEF; --on-accent:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --bad:#B0442E; --bad-soft:#F8E7E2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1918; --surface:#162322; --ink:#E2ECEA; --muted:#93A6A3; --line:#2A3B3A;
  --accent:#71BCC1; --accent-soft:#1D3433; --on-accent:#0E1918;
  --ok:#6CC892; --ok-soft:#173226; --bad:#EE8D76; --bad-soft:#3A1F19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1918; --surface:#162322; --ink:#E2ECEA; --muted:#93A6A3; --line:#2A3B3A;
  --accent:#71BCC1; --accent-soft:#1D3433; --on-accent:#0E1918;
  --ok:#6CC892; --ok-soft:#173226; --bad:#EE8D76; --bad-soft:#3A1F19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
h1{font-size:24px;line-height:1.25;margin:2px 0 0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:18px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode,.chip,.seg button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px}
.mode{padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-size:14.5px}.mode span{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;font-size:13.5px}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 16px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:12px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted)}
/* quiz */
.bar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.track{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{font-variant-numeric:tabular-nums}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 14px;text-wrap:pretty}
.verdict{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.verdict .v{font-weight:700;font-size:15px}
.verdict.ok .v{color:var(--ok)}.verdict.bad .v{color:var(--bad)}
.verdict .ans{font-size:15.5px;font-weight:600}
.verdict .exp{font-size:13.5px;color:var(--muted)}
/* result */
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--line)}td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrong-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.wrong-list li{border-bottom:1px solid var(--line);padding-bottom:10px}
.wrong-list .wq{font-size:14px}.wrong-list .wa{font-size:13.5px;color:var(--ok);font-weight:600}
@media (max-width:420px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:baseline;gap:8px}}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;font:inherit;font-size:15px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.45}
.opt .k{font-family:var(--mono);font-size:12.5px;flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.opt span:last-child{min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.src{margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.src summary{cursor:pointer;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none;display:flex;justify-content:space-between;gap:8px}
.src summary::-webkit-details-marker{display:none}
.src summary::after{content:"접기";font-weight:500;color:var(--muted);font-size:12.5px}
.src:not([open]) summary::after{content:"펼치기"}
.src .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.src .std{font-size:12.5px;color:var(--muted)}
.src .item{font-size:15px;font-weight:600}
.src .facts{display:flex;flex-wrap:wrap;gap:6px}
.src .facts span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.src .facts b{color:var(--ink);font-weight:600;margin-right:4px}
.src h4{margin:0 0 4px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.src .txt{white-space:pre-line;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.src .ansbox .txt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.src .fbnote{font-size:12.5px;color:var(--bad)}
.tag.ref0{background:var(--line);color:var(--muted)}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.toggle small{color:var(--muted)}
.chip.c0 small{font-family:var(--mono)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">5주기 인증 · Q&amp;A Ver.5.1</div>
    <h1>25병동 인증 퀴즈</h1>
    <div class="sub">인증 Q&amp;A 파일의 모든 조사항목을 4지선다로 담았어요. 고르면 바로 정답과 해설, 인증Q&amp;A 원문 근거가 나옵니다.</div>
  </header>

  <section id="setup" class="card stack">
    <div>
      <div class="label">출제 방식</div>
      <div class="modes" role="group" aria-label="출제 방식">
        <button class="mode" id="m-all" data-mode="all" aria-pressed="true"><b>전체 무작위</b><span id="cnt-all"></span></button>
        <button class="mode" id="m-cat" data-mode="cat" aria-pressed="false"><b>카테고리별</b><span>장별로 골라 풀기</span></button>
        <button class="mode" id="m-wrong" data-mode="wrong" aria-pressed="false"><b>오답 다시</b><span id="cnt-wrong"></span></button>
      </div>
    </div>
    <div id="catBox" hidden>
      <div class="label">카테고리 (여러 개 선택 가능)</div>
      <div class="chips" id="chips"></div>
    </div>
    <label class="toggle" for="incRef"><input type="checkbox" id="incRef" checked> 참고용 항목도 포함 <small>(우리 병동 해당 아님 · <span id="cnt-ref"></span>문제)</small></label>
    <div>
      <div class="label">문제 수</div>
      <div class="seg" role="group" aria-label="문제 수" id="seg">
        <button id="n10" data-n="10" aria-pressed="false">10</button>
        <button id="n20" data-n="20" aria-pressed="true">20</button>
        <button id="n50" data-n="50" aria-pressed="false">50</button>
        <button id="nall" data-n="0" aria-pressed="false">전체</button>
      </div>
    </div>
    <div class="row"><button class="btn" id="start">시작하기</button></div>
    <div class="hint" id="setupHint"></div>
  </section>

  <section id="quiz" hidden class="stack">
    <div class="bar"><span id="pos">1/10</span><div class="track"><i id="prog" style="width:0"></i></div><span class="score" id="sc">0점</span></div>
    <div class="card">
      <div class="meta"><span class="tag" id="qcat"></span><span class="tag ref0" id="qref0" hidden>참고용</span><span class="ref" id="qref"></span></div>
      <p class="q" id="qtext"></p>
      <ol class="opts" id="opts"></ol>
      <div id="result" hidden style="margin-top:12px" class="stack">
        <div class="verdict" id="verdict">
          <div class="v" id="vtext"></div>
          <div class="ans" id="vans"></div>
          <div class="exp" id="vexp"></div>
        </div>
        <div class="row"><button class="btn" id="next" type="button">다음 문제</button></div>
        <details class="src" id="src" open>
          <summary id="srcHead"><span>근거 자료</span></summary>
          <div class="body" id="srcBody"></div>
        </details>
      </div>
    </div>
    <div class="row"><button class="btn quiet" id="quit" type="button">그만 풀고 결과 보기</button></div>
    <div class="hint">키보드: 1~4로 선택, Enter로 다음 문제</div>
  </section>

  <section id="done" hidden class="stack">
    <div class="card stack">
      <div><div class="label">결과</div><div class="big" id="final"></div></div>
      <table id="bycat"></table>
      <div class="row">
        <button class="btn" id="retryWrong" type="button">이번 오답만 다시</button>
        <button class="btn ghost" id="home" type="button">처음으로</button>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <div class="label">틀린 문제</div>
      <ul class="wrong-list" id="wrongList"></ul>
    </div>
  </section>
</div>

<script>
const CATS={1:"1장 환자안전",2:"2장 진료전달·평가",3:"3장 환자진료",4:"4장 의약품",5:"5장 수술·시술·진정",6:"6장 환자권리",7:"7장 질향상·안전보고",8:"8장 감염관리",9:"9~11장 경영·직원·시설"};
// [카테고리, 기준, 병동해당(1)/참고용(0), 문제, 정답, 오답1, 오답2, 오답3, 해설]
const RAW=[
[1,"1.1 ME2",1,"정확한 환자확인에 쓰는 두 가지 지표는?","이름 + 등록번호","이름 + 병실번호","이름 + 진단명","등록번호 + 침상번호","등록번호 확인이 어려우면 이름 + 생년월일"],
[1,"1.1 ME2",1,"등록번호 확인이 어려운 상황에서 이름과 함께 쓰는 지표는?","생년월일","주소","주치의 이름","입원일",""],
[1,"1.1 ME2",1,"환자 이름을 확인하는 올바른 질문은?","\"이름이 어떻게 되십니까?\"","\"홍길동 님 맞으시죠?\"","\"몇 호실 환자분이시죠?\"","\"오늘 시술하시는 분 맞죠?\"","개방형 질문으로 환자가 직접 성명을 말하게 함"],
[1,"1.1 ME2",1,"입원환자 인식팔찌를 제거하는 시점은?","퇴원(전원·사망 포함) 직전","입원 후 24시간","전동 시","퇴원 다음 날",""],
[1,"1.1 ME2",1,"PDA(환자안전시스템) 사용 시 환자확인 방법은?","개방형으로 이름 질문 + 팔찌 바코드 스캔 대조","바코드 스캔만 하면 됨","이름 질문만 하면 됨","침상 이름표만 확인",""],
[1,"1.1 ME2",1,"의식이 명확하지 않은 환자의 확인 방법은?","보호자에게 성명 확인, 보호자가 없으면 환자인식표로 확인","침상 이름표만 확인","확인 생략","동료 간호사에게 확인",""],
[1,"1.1 ME2",1,"환자확인을 반드시 해야 하는 시기가 아닌 것은?","식사 배식 후","의약품 투여 전","수혈 전","검사 시행 전","확인 시기: 투약·수혈·검사·진료/처치/시술 전"],
[1,"1.1 ME2",0,"신생아의 환자인식표 착용 방법은?","손목·발목에 2개","손목에 1개","침상에만 부착","발목에 1개","초미숙아는 한쪽 손목·발목 또는 연결된 센서라인"],
[1,"1.1 ME3",1,"수혈 전 환자확인 방법은?","의료인 2인이 소리 내어 개방형 질문 + 팔찌·출고바코드 대조","간호사 1인이 바코드만 스캔","보호자에게만 확인","혈액은행 직원이 확인","원본 답변 빈칸 → 3.10 ME3 기준 적용"],
[1,"1.1 ME4",0,"외래·검사실 환자의 확인 도구가 아닌 것은?","환자인식팔찌","진료카드","진료·검사 예약증","키오스크 접수증","팔찌는 입원환자용"],
[1,"1.1 ME5",0,"외래 진료·처치·시술 전 환자확인은 몇 가지 지표로 하나?","두 가지","한 가지","세 가지","환자가 원하는 만큼",""],
[1,"1.2 ME2",1,"구두·전화처방이 허용되는 상황은?","수술·시술·응급 등 EMR에 접근할 수 없어 치료에 지장이 있을 때","의사가 바쁠 때","야간 근무 중 언제나","처방 입력이 번거로울 때",""],
[1,"1.2 ME2",1,"구두·전화처방 절차 순서는?","Write down → Read back → Confirm","Read back → Write down → Confirm","Confirm → Write down → Read back","Write down → Confirm","PHIS 구두/전화처방 메모지 사용"],
[1,"1.2 ME2",1,"구두처방 후 의사가 전산처방으로 전환하는 기한은?","24시간 이내","12시간 이내","48시간 이내","퇴원 전까지",""],
[1,"1.2 ME2",1,"구두로 처방할 수 있는 검체검사는 몇 종인가?","12종","2종","20종","제한 없음","검체 12종, 영상 2종, 특수 2종"],
[1,"1.2 ME2",1,"약물 구두처방 메모 입력 경로는?","입원간호>처방확인>버튼모음>구두(약)","통합메뉴>위험관리>구두처방","진료공통>약품목록조회","입원간호>인계장","검사는 재료 및 처치등록>버튼모음>구두검사"],
[1,"1.2 ME3",0,"PRN 처방 가능 의약품의 선정·관리 자료를 확인하는 곳은?","약제부(의약품관리 ST)","간호부","적정관리팀","원무팀",""],

치, 강도, 양상, 빈도, 기간 등\n(의사) 처방-입원기록-통증평가 \n(간호사) 입원간호-통증관리기록"},"3.3 ME4":{"t":"통증평가 결과에 따라 통증을 관리한다.","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사, 간호사","chk":"* (의사, 간호사, 관련 자료 확인)\n* 통증평가 결과에 따른 통증 중재방법(약물요법, 비약물요법) 수행 및 기록 확인\n* 통증 중재 효과 평가 확인 \n* 통증 중재 후 효과 평가 수행의 적절성을 시간 단위로 계산하여 판단하지 않도록 주의","ans":"[PHIS확인] 간호기록, 통증관리기록 \n1) 통증강도가 NRS 4점, Wong-Baker 얼굴통증등급 4점, FLACC 4점, NIPS 5점, CNPS 3점 이상이거나, 환자가 경증의 통증이라도 중재를 요청하는 경우 통증 완화중재를 제공하고 기록\n2) 통증 중재방법 \n- 비약물요법: 온냉요법, 마사지, 심호흡 및 이완요법, 기분전환 등의 신체적/심리적 비약물요법을 시행\n- 약물요법: 의사처방에 따라 중재 수행, 효과 및 부작용 관찰, 기록\n3) 필요 시 다학제적 접근 치료 \n4) 환자 및 보호자에게 통증관리에 대한 교육 제공\n5) 약물/비약물요법 등 중재후 효과 평가"},"3.3 ME5":{"t":"입원환자 상태변화 시 통증 재평가를 수행한다.","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사, 간호사","chk":"* (의사, 간호사, 관련 자료 확인)\n* 통증 재평가 대상 확인\n* 통증 평가도구 확인\n* 통증평가 기록 확인","ans":"[PHIS확인] 통증관리기록_통증 재평가 시기\n1) 상태변화시: 침습적 시술/수술후, 새로운 통증 발생/통증양상 변화시, 의사소통 가능여부에 따른 의식수준 변화시, 통증조절을 위한 진통제의 지속적 주입, 주기적 투여 또는 전신효과를 나타내는 부착형 진통제 투여 중단 후\n2) 매일: 통증조절을 목적으로 진통제를 지속적으로 주입하거나 주기적으로 투여하는 환자 또는 전신효과를 나타내는 부착형 진통제를 사용하는 환자\n3) 통증중재(약물-주사,경구약,외용약, 비약물) 후 1시간 내\n4) 마취회복실: 입실 중 2회 이상 재평가"},"3.4 ME2":{"t":"환자의 치료목적에 맞게 식사를 제공한다","m":"관찰, 질문","loc":"병동, 영양관리부서","who":"의사, 영양사","chk":"* (의사, 관련 자료 확인) \n- 치료식 제공 대상자, 치료식 처방 확인\n- 치료식 제공 대상자 중 처방되지 않은 경우, 명확한 사유 확인\n* (영양사) 치료식 종류, 치료식 제공 절차(신청~제공) 확인","ans":"[PHIS확인] \n(의사) 의사처방-식이처방, 입원간호-식이등록 \n(영양사) 치료식 종류 및 신청부터 제공절차-영양기록(통합기록조회)"},"3.4 ME3":{"t":"환자에게 치료식에 대해 설명한다.","m":"환자면담, 관찰","loc":"병동","who":"환자, 영양사, 의사","chk":"* (영양사 또는 의사) - 치료식 설명 내용 확인 \n* (치료식을 제공 받는 환자) \n- 제공되는 치료식에 대해 설명 여부, 내용 등 확인\n- 설명을 듣지 못하였다고 답한 경우: 치료식 설명 근거 자료 확인(예시 : 안내문, 설명환자 명단, 업무일지 등)","ans":"(환자인터뷰) \n[PHIS확인] 통합기록조회-영양기록\n<치료식 설명>-영양사(환자 또는 보호자에게)\n- 치료식사명, 제공사유, 주의사항(음식 제한사항 등) 설명 \n- 영양기록(통합기록조회)에 기록"},"3.5 ME3":{"t":"영양집중지원이 필요한 환자에게 적합한 치료계획을 수립한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사, 간호사. 영양집중지원팀","chk":"* (의사 또는 간호사) \n- 영양집중지원 환자의 영양지원 의뢰 방법 확인\n* (영양집중지원팀, 관련 자료 확인)\n- 환자의 영양지원 의뢰방법 확인, 영양평가 확인, 영양관리 치료계획 확인, 제공된 영양집중지원서비스 확인, 정맥영양/경장영양 관리 확인","ans":"[PHIS확인] NST 회신, NST 모니터링 회신\n1) 영양사가 영양초기평가를 통하여 영양불량 위험 환자를 담당의에게 고지하고, 영양집중지원이 필요한 경우 의료진에게 협진의뢰를 요청\n2) 영양불량 위험환자 외에 치료과정에서 담당의가 영양집중지원이 필요하다고 판단되는 경우 의뢰"},"3.5 ME4":{"t":"치료계획에 따라 영양집중지원서비스를 제공한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"영양집중지원팀","chk":"* (영양집중지원팀) \n- 치료계획에 따라 제공된 영양집중지원서비스 확인","ans":"[PHIS확인] NST 회신, NST 모니터링 회신"},"3.5 ME5":{"t":"영양집중지원 환자를 관리한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"영양집중지원팀","chk":"* (영양집중지원팀, 관련 자료 확인) \n- 영양집중지원환자 모니터링 확인","ans":"[PHIS확인] NST 회신, NST 모니터링 회신"},"3.6 ME2":{"t":"욕창 위험 평가도구를 이용하여 환자 입원 시 초기평가를 수행한다.","m":"관찰, 질문","loc":"병동, 중환자실","who":"간호사","chk":"* (간호사, 관련 자료 확인)\n* 욕창 위험 초기평가의 평가대상, 평가도구, 평가주기 확인\n*욕창 위험 초기평가 기록 확인","ans":"[PHIS확인] 욕창위험사정 기록\n-초기평가대상: 입원환자\n-초기평가시기: 입원시\n-초기평가도구: 욕창 위험 사정 도구\n1) 8세이상: Braden Scale\n2) 1세이상~8세 미만의 소아환자: Braden Q Scale\n3) 1세 미만의 신생아/영아: neonatal/infant Braden Q scale"},"3.6 ME3":{"t":"욕창 위험 평가결과에 따라 고위험환자에 대한 욕창 예방활동을 수행한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"간호사","chk":"* (간호사, 관련 자료 확인)\n* 욕창 예방활동 수행 내용 확인 \n* 욕창 예방활동 관련 기록 확인","ans":"[PHIS확인] 욕창위험사정 기록-욕창예방활동, 임상관찰기록\n<욕창예방활동 주기>\n- 일반병동 고위험군&욕창환자:근무조별 1회\n- 중환자실: 모든 환자에게 근무조마다 시행"},"3.6 ME4":{"t":"욕창 위험 평가도구를 이용하여 정기적인 재평가를 수행한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"간호사","chk":"* (간호사, 관련 자료 확인)\n* 욕창 위험 재평가의 평가대상ㆍ평가도구ㆍ평가주기 확인\n*욕창 위험 재평가 기록 확인","ans":"[PHIS확인] 욕창위험사정 기록\n-재평가대상: 입원환자\n-재평가도구: Branden scale, Branden Q scale, neonatal/infant braden Q scale\n-재평가시기\n 1) 정기적 : 비위험군/저위험군/중위험군 주1회, 고위험군&욕창환자 1일 1회\n 2) 전동 시\n 3) 상태변화 시 : 욕창 발생 시, 의식/감각인지/기동성 저하 시, 수술 등 부동 상태 발생 시"},"3.6 ME5":{"t":"욕창이 발생한 환자에게 욕창 관리활동을 수행한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"간호사, 의사","chk":"* (간호사, 의사, 관련 자료 확인)\n* 욕창 발생 환자 사례를 보며 관리활동 확인\n* 욕창 관리활동 기록 확인","ans":"[PHIS확인] 피부욕창관찰기록, 협진의뢰 등\n1) 욕창사정\n- stage 1이상 욕창발생 시 담당의에게 보고하고, 기록하며 욕창발생보고서를 작성\n- 욕창 진행 상태는 pressure ulcer scale for healing(PUSH) 로 평가\n- 욕창 상태 지속적 관리 위해 피부욕창관찰기록지에 주 1회 이상 욕창 평가 및 치료과정 기록\n2) 욕창간호\n- 욕창부위 삼출물의 양, 감염여부에 따라 드레싱 종류, 주기결정\n- 욕창이 악화되지 않도록 욕창간호활동 n* (의사, 간호사, 심폐소생술 관련 직원)\n- 제세동기 위치 및 사용법 확인","ans":"1) 가까운 제세동기 위치 숙지_그룹웨어 공지사항 참조\n2) 실제 제세동기 3분이내 도착시간 측정 및 사용방법 시연\n(수동제세동기 사용법) - 제세동기에 인쇄물 부착됨\n1. 전원(ON)을 켠다 \n 심전도 전극 부착한다\n2. 패들에 초음파젤을 도포한다(에너지전달, 화상예방위해)\n3. 에너지를 선택한다\n4. 충전한다(CHARGE)\n5. 위치를 확인한다.\n * Sternum 패들: 우측쇄골하방, 오른쪽흉골\n * Apex 패들: 좌측유두측하방, 왼쪽옆구리\n6.\"모두 떨어지세요\"(CLEAR) 라고 크게 외치고, 눈으로 모든 사람이 환자로부터 떨어진 상태를 확인한다\n7. 제세동을 실시한다(SHOCK)\n(자동제세동기 사용법)\n1. 전원 버튼을 누른다(ON/OFF)\n2. 패드의 그림과 같이 패드를 환자에게 부착한다\n3. 접촉금지라는 말이 나오면 \"모두 떨어지세요\" 하고 소리치고 본인도 떨어진다\n4. 음성안내에 따라 전기충격버튼을 누른다\n5. 바로 심폐소생술을 시행한다"},"3.10 ME2":{"t":"불출된 혈액제제를 관리하고, 적절한 시간에 환자에게 수혈한다.","m":"관찰, 질문","loc":"병동, 수술실, 응급실, 중환자실","who":"간호사","chk":"* (관찰)\n- 불출된 혈액제제 보관 상태 확인\n* (간호사)\n- 불출된 혈액제제 보관 및 관리 방법 확인\n- 혈액전용냉장고가 있는 경우 : 혈액제제 분리보관 및 적정온도 관리 수행 및 기록 확인\n- 혈액전용냉장고가 없는 경우 : 적절한 시간 내 수혈 여부 기록 확인","ans":"[불출된 혈액제제 확인 절차]\n1) 수혈 전 2인의 의료인이 확인\n2) 확인항목: PHIS의 혈액정보와 혈액출고바코드 대조(환자이름, 등록번호, 혈액형, 혈액번호, 혈액제제명)\n3) 환자안전시스템 사용 시: 2인 의료인이 직원 ID와 혈액출고바코드 인식하여 PHIS 수혈간호기록과 혈액출고바코드 대조(환자이름, 등록번호, 혈액형, 혈액번호, 혈액제제명)\n4) 혈액 제제 외관검사:; 양, 색깔, 혈액백의 외관 확인→ 이상 시 즉시 수혈의학검사실 연락\n[불출된 혈액제제 보관 및 관리]\n1) 혈액전용냉장고 사용 시\n- 온도는 1~6℃를 유지, 1일 1회 온도 확인 및 기록\n- 지속적인 온도유지는 온도 자동 기록으로 확인(단, 자동기록장치에 문제가 있는 경우 4시간 간격으로 온도를 점검하고 기록)\n- 자동온도기록지는 1년간 보관\n- 혈액제제 구분: 혈액형별, 환자별로 구분하여 보관\n2) 혈액전용냉장고 없는 경우\n- 출고 후 혈액제제의 첫 번째 단위는 30분 이내에 수혈시작"},"3.10 ME3":{"t":"수혈 직전 혈액제제 정보와 환자를 정확하게 확인한다.","m":"관찰, 질문","loc":"병동, 수술실, 응급실, 중환자실","who":"의사, 간호사","chk":"* 수혈 직전 2인의 의료인이 수령한 혈액제제 정보와 환자를 확인하는 과정 확인\n* 수혈 관련 기록 확인","ans":"[수혈 직전 혈액제제 정보와 환자 확인 절차]\n1) 수혈 직전 반드시 2인의 의료인이 소리 내어 확인\n2) 확인항목: 혈액제제 정보, 환자의 성명 및 등록번호, ABO 및 RhD 혈액형 비교\n 가) 개방형 질문으로 환자이름과 혈액형 확인\n 나) 환자인식표, 혈액출고바코드 대조:환자이름, 등록번호, 혈액형\n 다) 의식이 명확하지 않은 환자, 소아/신생아인 경우 환자인식표와 혈액출고바코드 대조\n 다) PDA 사용 시 환자인식팔찌와 혈액출고바코드 정보 일치여부 확인\n3) 2번째 이후 혈액제제 연결 시에도 2인의 의료인이 환자확인 과정 및 외관 검사 시행"},"3.10 ME4":{"t":"수혈 시 모니터링하고 부작용 발생 시 대처방안에 따라 수행한다.","m":"관찰, 질문","loc":"병동, 수술실, 응급실, 중환자실","who":"의사, 간호사","chk":"* 수혈부작용 발생 시 원내·외 보고절차 확인\n* 수혈부작용 발생 시 대처방안 확인\n* 수혈 시 모니터링 기록 확인","ans":"[수혈부작용 발생 시 대처방법] \n1) 수혈 시작 후 첫 15분간 환자 상태를 면밀히 관찰\n2) 급성용혈수혈반응 의심시 \n- 즉시 수혈을 중지하고 0.9% 생리식염수로 교체하여 수액요법 시행\n- 혈액출고용 스티커 및 환자정보 재확인 후 주치의 보고, 수혈의학검사실 연락\n- 수혈 중인 혈액제제 및 혈액검체(EDTA 4mL, Plain 6mL) 제출, 필요 시 추가 검사 시행\n[수혈부작용 발생 시 원내·외 보고절차]\n1) 원내보고\n- PHIS 수혈간호기록에 증상 유무 기록, 수혈이상반응 보고 등록\n- 단순 이상반응(발열, 오한, 두드러기 등): 증상 및 조치사항 등록\n- 중증 이상반응(가슴답답함, 호흡곤란, 혈뇨, 소변량 감소 등) 및 수혈 관련 오류: 수혈안전보고 등록 후 수혈의학검사실 연락\n- 수혈안전보고서, 혈액백, 수혈세트 제출 → 수혈전문의 평가\n2) 원외보고\n- 수혈의학검사실에서 한국혈액안전감시체계에 수혈관련 특이사항 등록\n[수혈 시 모니터링 및 기록: PHIS 입원간호-수혈간호기록]\n1) 수혈 시작 후 5~15분간 환자 상태를 면밀히 관찰\n- 전혈·적혈구·혈장: 전혈·적혈구·혈장: 수혈 시작 시·시작 15분 이내 활력징후 및 SpO₂ 측정, 이후 30분마다 환자 상태 관찰·기록, 1단위 완료 시 활력징후 및 SpO₂ 측정\n- 혈소판: 처방 단위별 수혈 시작·완료 시 활력징후 및 SpO₂ 측정\n2) 적정 혈액주입속도와 수혈관련 증상(혈압 저하, 발열, 오한, 호흡곤란, 두드러기 등)을 관찰\n3) 수혈부작용 의심 시 즉시 수혈 중지 및 담당의 보고, 조치에 따라 재개 여부 결정\n4) 대량수혈(TER): 수혈 시작 15분 이내 활력징후·SpO₂ 측정 및 일정 간격 관찰(장비 사용 시 시간 단위 기준)\n5) 수혈 중단 후 재시작 시에도 시작 시와 동일하게 모니터링"},"3.11 ME2":{"t":"항암화학요법을 수행하는 직원은 적격한 자격이 있다.","m":"관찰, 질문","loc":"병동, 약제부","who":"의사, 약사, 간호사","chk":"(의사, 간호사 약사)\n* 항암화학요법을 시행한 환자의 의무기록에서 관련 의료인의 이름 확인","ans":"[PHIS 확인] 통합메뉴-직무기술서, 진료권한정의서"},"3.11 ME3":{"t":"환자에게 항암화학요법에 대한 정보를 제공한다.","m":"관찰, 질문","loc":"병동","who":"의사, 간호사","chk":"* 환자에게 정보를 제공하는 정보 및 방법 확인\n - 설명문 또는 동의서 확인","ans":"[PHIS 확인] 설명문이나 항암동의서, 복약안내문"},"3.11 ME6":{"t":"항암제를 안전하게 투여한다.","m":"관찰, 질문","loc":"병동,외래","who":"의사, 간호사","chk":"(관찰, 의사, 간호사)\n* 항암제 투여 직전 5-rights 및 의약품 상태 확인\n* 개인보호구 착용 여부 확인 \n* 척수강 내 의약품 투여 방법 확인\n* 정맥 내 유지침 관리 방법 확인\n* 정확한 항암제 투여 용량 확인\n - 관련 내용을 찾아서 제시할 수 있는지 확인","ans":"[항암제 투여시 주의사항]\n1) 항암제는 항암화학요법에 대해 교육을 받은 의사 또는 간호사가 투여\n2) 투여 직전 개인 보호구(장갑, 마스크) 착용, 5 Rights(환자, 의약품명, 용량, 투여시간, 투여경로) 및 의약품 상태(파손, 이물질 여부 등)를 확인, 단 다량의 항암제에 노출될 가능성이 있는 경우는 필요 시 일회용 가운 착용 권고\n3) 척수강내 투여 의약품은 투여 직전 의료인 2인이 5 Rights를 확인, 다른 경로로 투여되는 의약품과 동시 준비 및 투여 금지(단, 정맥 수액주입 시 등은 제외)\n4) 의료진은 투여 속도가 처방과 일치하는지 주기적으로 확인하여 정확한 용량이 투여되도록 하고, 간호기록 수행"},"3.11 ME7":{"t":"항암화학요법 시 부작용 여부를 관찰하고 기록한다.","m":"관찰","loc":"병동,외래","who":"간호사","chk":"* 항암화학요법 부작용 발생 시 대처방안 및 기록 확인-관련 내용을 찾아서 제시할 수 있는지 확인","ans":"[부작용 발생 시 대처방안]_간호기록 제시\n 즉시 담당의에게 보고하고 증상에 대한 조치 취하고 기록"},"3.11 ME8":{"t":"항암화학요법 후에 안전하게 폐기한다","m":"관찰","loc":"병동,외래","who":"간호사","chk":"* 항암제 투여 후 폐기 절차 확인","ans":"1) 항암제 폐기 시 개인보호구 착용\n2) 항암제 약물 잔량과 사용된 물품들은 새거나 휘발되지 않도록 항암제 폐기봉투에 밀봉 후 의료폐기물(생물화학폐기물) 전용용기에 넣어 폐기\n3) 항암제로 오염된 세탁물은 장갑 착용 후 취급하며, 오염세탁물로 처리"},"3.12 ME2":{"t":"신체보호대를 적절하게 사용한다.","m":"관찰 질문","loc":"병동, 중환자실","who":"의사, 간호사","chk":"[의사] \n* 신체보호대 사용기준, 종류 및 사용방법 확인 \n* 신체보호대 처방, 설명 및 동의서 확인\n[간호사] \n* 신체보호대 사용 환자의 정기적 관찰 및 평가 여부 확인 \n* 부작용 발생 시 중재 방법 확인 \n* 부작용 발생 예방을 위한 활동 확인 \n* 신체보호대 관련 교육 시행 자료 확인","ans":"[PHIS 확인] \n처방(신체보호대 처방, 동의서)\n1) 처방항목 : 사용사유, 방법, 신체부위, 종류 등\n2) 설명 및 동의: 입원기간 중 최초 사용시 사용사유를 설명하고 동의서를 작성(응급상황의 경우 우선 적용하고 구두동의를 받은 후 보호자 내원하여 서면동의)\n간호(신체보호대 관찰기록)\n1) 관찰 및 평가주기: 2시간 마다 \n2) 기록: 사용부위 및 종류, 적용사유, 부작용 유무, 부작용(감각, 순환, 피부손상, 운동, 호흡, 행동이나 정서변화) 및 부위, 부작용 중재, 부작용 예방활동\n※ 처방기록과 간호수행기록 일치 중요\n교육: PHIS-직무기술서-교육현황(연 1회 )"},"4.3 ME2":{"t":"모든 의약품을 안전하게 보관한다","m":"관찰, 질문","loc":"약제부서, 병동, 중환자실, 수술실, 응급실, 주사실, 외래","who":"약사,간호사","chk":"(관찰)\n* 의약품 라벨링 관리상태 확인\n(의약품관리 ST_관련자료)\n* 비치의약품 목록 관리 자료 확인","ans":"[의약품보관실, 조제실, 병동, 중환자실, 수술실, 응급실, 주사실, 외래 등 약품보관 및 취급부서 조사대상]\n1) 의약품 보관 장소는 외부인의 출입 제한\n2) 의약품라벨링: 의약품명, 성분명, 함량, 제형, 유효기간, 필요시 경고문을 라벨링하여 보관\n3) 약품에 맞게 약물보관여부 확인(냉장, 차광 등)\n4) 보관실과 조제실, 병동의 비치의약품 목록 관리\n 가) 비치의약품 내역표는 약제부와 해당부서 담당자의 서명 후 각 1부씩 상호 보관\n 나) 비치의약품 목록 및 수량 변동사항이 있거나, 의약품 교환으로 인한 유효기간 변경 등 사유 발생 시 비치의약품 내용 조정 후 가)와 동일하게 처리\n 다) 비치의약품 목록, 수량에 대한 적정성 검토는 연1회(3분기) 비치 부서에서 자체적으로 시행\n 라) 약제부에서는 응급비치 및 일반비치의약품의 경우 분기별 1회, 비상 마약류는 월1회 비치 부서 방문하여 점검\n 마) 비치의약품 교환: 유효기간 6개월 미만의 의약품이 있는 경우 월1회 비치의약품 교환기간 내에 약제부 통해 교환\n5) 원내 의약품 보관정책에 맞춰 표준화된 보관 확인"},"4.3 ME4":{"t":"응급의약품을 안전하게 보관한다.","m":"관찰, 질문","loc":"약제부서, 병동, 중환자실, 수술실, 응급실, 주사실, 외래","who":"약사,간호사","chk":"(관찰)\n* 응급의약품 보관 및 관리 방법 확인\n(의약품 관리 ST_관련자료)\n* 응급의약품 목록 확인\n* 응급의약품 점검 수행 자료 확인","ans":"[응급카트 및 점검대장 확인]\n1) 응급카트 의약품 및 물품관리\n 가) 입원(매 근무조), 외래(평일1회) 봉인유지 확인\n 나) 주1회 이상(수량, 후두경 불밝기 점검) 봉인 뜯은 후 확인\n 다) 월1회(유효기간, 종류, 수량 점검) 봉인 뜯은 후 확인\n2) 사용하였을 경우: 최대한 빠른 시간 내에 처방하여 응급카트 내 의약품 수량을 항상 일정하게 유지\n3) 의약품의 보관조건을 준수하여야 하며, 점검대장을 작성하고, 유효기간 6개월 미만 의약품 있을 시는 약제부에서 교환\n4) 응급상황 외 봉인지 파손 확인 시→ 즉시 응급카트 개봉하여 종류, 수량, 유효기간, 보관상태 등 점검→ 새 고유번호의 봉인지로 봉인\n5) 봉인지는 관리책임자가 별도의 장소에 외부인이 접근할 수 없도록 관리"},"4.3 ME5":{"t":"마약류를 안전하게 보관한다.","m":"관찰, 질문","loc":"약제부서, 병동, 중환자실, 수술실, 응급실, 주사실, 외래","who":"약사,간호사","chk":"* 마약류 보관 및 관리 방법 확인\n* 임시마약류 보관 및 관리 방법 확인","ans":"[마약류 보관장 및 점검대장 확인]\n1) 마약류 저장시설은 외부에 쉽게 노출되지 않고 이동이나 잠금장치의 파손이 어렵도록 조치\n2) 마약류, 임시마약류의 보관 및 점검\n가) 마약: 다른 의약품과 구별, 이동이 불가능하고 이중 잠금 장치설치된 철제 금고(철제와 동등 이상의 견고한 재질로 만들어진 금고 포함)에 보관\n나) 향정, 예고임시마약류 또는 임시마약류: 일반약과 구분, 이동이 불가능하고 잠금장치가 설치된 장소에 보관\n다) 냉장, 냉동보관이 필요한 마약류도 잠금장치가 설치된 장소에 보관\n라) 잔여, 반납, 파손, 유효기간 경과 마약류 등 폐기마약류도 동일한 조건의 장소에 보관\n마) 마약류 저장시설은 1일 1회 의료용 마약류 저장시설점검장부를 작성. 매 근무조마다 사용 여부 확인하여 pHIS 비상마약류 점검대장에 등록, 수령/투여/반납 시마다 PHIS 마약류 관리대장에 등록"},"4.3 ME6":{"t":"고위험의약품을 안전하게 보관한다.","m":"관찰, 질문","loc":"약제부서, 병동, 중환자실, 수술실, 응급실, 주사실, 외래","who":"약사,간호사","chk":"(관찰)\n* 고위험의약품 목록 공유 내용 확인\n* 다른 의약품과 분리 보관 및 고위험 표시 확인\n* 고농도전해질제제 보관장소에 \"반드시 희석 후 사용\"라벨링 확인\n* 다회 사용 개봉의약품의 의약품명, 개봉일자, 유효기간 라벨링 확인\n(의약품 관리 ST_관련자료)\n* 고위험의약품 목록 선정 및 관리 자료 확인\n* 고위험의약품 목록 공유 자료 확인","ans":"[고위험의약품 비치장소 확인-PHIS 목록조회 가능]\n1) 종류: 고농도 전해질, 주사용 인슐린, 주사용 항혈전제, 주사용 항암제, 중등도 진정 의약품, 신경근 차단제\n2) 보관: \" 고위험의약품라벨\"을 부착한 지정된 장소에 다른 의약품과 분리하여 보관, 의약품에 \"고위험의약품\" 라벨 부착된 상태로 부서 수령 및 확인 후 환자 투여 직전까지 환자별 트레이에 다른 의약품과 구분하여 보관(단, 신경근 차단제의 경우 '고위험의약품 신경근차단제(호흡마비 주의) '라벨을 부착하고 투여 직전까지 다른 의약품과 구분하여 보관), 냉장보관 고위험의약품은 냉장고 내 \" 고위험의약품\" 라벨을 부착한 지정된 장소에 보관\n3) 고농도 전해질: KCl, NaCl, 3% NaCl, 50% MgSO4, Na acetate\n 가) 투여: 원액의 정맥투여는 절대금기이며 반드시 희석해서 투여(예외: 3% NaCl)\n4) 주사용 인슐린: Novorapid vial 1000unit/10ml, Lantus vial 1000unit/10ml, humulin N vial 1000unit/10ml, Humulin R 1000unit/10ml\n 가) 투여: 개봉 인슐린은 용기에 사용기간 기록, 개봉전: 냉장보관, 개봉후: 실온보관(개봉 전 냉장보관 스티커 제거 후 환자별 보관 )\n5) 주사용 항혈전제: Heparin Na25,000 IU/5mL, Clotinab vial 10mg/5ml, AntithrombinⅢ 500 IU, No 약품 준비 구역(병동, 중환자실, 응급실)","who":"약사, 간호사","chk":"(약제부서 관찰)\n* 의약품 조제 장소 출입 관리 확인\n* 조제구역의 구분 및 청결 유지 상태 확인\n* 환기시설 구비 및 관리 상태 확인(가루약 조제가 전혀 발생하지 않는 경우는 반드시 집진 장비를 설치해야 하는 것은 아님, 무균조제가 필요한 의약품이 없는 경우 반드시 환기시설을 설치해야 하는 것은 아님)\n* 조제대 및 조제기기 청결 상태 확인\n(병동/중환자실/응급실 의약품 준비구역 관찰)\n* 의약품 준비구역 출입 관리 확인(직원이 상주하지 않는 의약품 준비 구역은 일반인의 접근이 어렵도록 관리)\n* 의약품 준비구역의 구분 및 청결 상태 확인(의약품 준비구역은 청결구역으로 오염된 물품 세척 등 오염구역에서 수행되는 작업이 수행되지 않아야 함, 의약품 준비구역 없이 환자 앞 전용 카트에서 의약품을 준비하는 경우 청결상태 등 환경관리 조사)","ans":"[약제부 조제구역]\n물리적 통제 및 공간구획 확인, 물기 등 오염 유발요인을 제거하여 건조상태 유지, 조제장소에서의 음식물 섭취를 제한하는 등 적절한 환경 위생 관리를 수행, 사무공간과 분리\n[의약품 준비구역]\n1) 외부인의 출입을 통제\n2) 별도 구획하고 물기 등 오염 유발요인을 제거하여 청결 상태를 유지"},"4.4 ME7":{"t":"주사용 의약품 취급의 감염 및 안전관리를 준수한다.","m":"관찰, 질문","loc":"병동, 중환자실, 응급실","who":"간호사, 의사","chk":"(관찰)\n* 주사용 의약품 취급 시 감염 관리 수행 확인(주사감염 예방 안전 가이드라인, 표준예방지침 등에 근거하여 수행하는지 관찰)\n* 일회용 주사기 및 주사침 일회 사용 후 전용 용기 폐기 확인\n* 카테터, 수액세트 교체주기 준수 여부 확인\n* 주사용 의약품 사용법 및 취급 시 주의사항 등 확인(일회용 바이알, 수액 등 분할 사용 금지 포함)","ans":"1) 주사기와 주사침\n 주사용 의약품이 들어있는 주사기에서 다른 주사기로 약물을 옮기지 않으며, 사용 주사침은 합성수지의료폐기물 전용용기에 폐기\n2) 말초 정맥 카테터 교체주기 \n 가) 성인: 96시간마다 교체, 응급상황 삽입시 48시간 이내 교체\n 나) 소아: 정맥염/기타 문제 발생하지 않으면 주기적으로 교환하지 않음\n3) 수액세트 관리\n 가) 혈액, 혈액제제, 지방제제 주입: 24시간 이내 교체\n 나) 혈액, 혈액제제, 지방제제 미주입: 96시간 간격 교체\n 다) 수액연결 부위(needless connector, hub 등)는 적어도 수액세트 교체 간격(96시간 간격)에 따라 교체\n4) 주사용 의약품 사용법 및 취급 시 주의사항\n 가) 약물을 육안으로 확인하여 손상 또는 성상의 변화가 보이면 사용하지 말고 이상 의약품 보고서를 작성하여 이상 약물과 함께 약제부로 전달\n 나) 환자에게 투여하기 직전 주사기에 약물을 준비, 준비된 약물은 가능한 1시간 이내에 투여(단, 무균조제대에서 조제하는 경우는 예외)\n 다) 일회용량 약제는 한 명의 환자에게만 사용하며, 사용 후 잔량은 폐기\n 라) 주사침은 바이알에서 주사제를 채취한 후 즉각 제거\n 마) 수액백/병, 주사기 등 표면에 라벨을 부착\n 바) 다회용량 바이알: 처음 개봉 시 유효기간 명시, 제조사에서 권고한 개봉 후 유효기간 경과 시 폐기, 가능하면 한 명의 환자에게 배정하고 환자 처치장소와 인접한 곳에 보관하지 않으며 오염이 의심될 경우 즉시 폐기, 사용 전 고무마개를 매번 소독하고 주사기와 주사침은 모두 멸균된 것을 사용\n 사) 수액제: 수액병/백에서 수액을 뽑아 여러 환자에게 관류용으로 사용하지 않음"},"4.5 ME2":{"t":"의약품을 투여하는 직원은 적격한 자격이 있다.","m":"관찰, 질문","loc":"병동","who":"의사, 간호사","chk":"* 의약품을 투여하는 직원의 이름 확인\n(인적자원관리 ST_관련자료)\n* 현장에서 확인한 직원의 인사정보 확인","ans":"*직무기술서 또는 진료권한정의서 확인(자격 및 면허, 교육등)"},"4.5 ME3":{"t":"의약품 투여 시 필요한 정보를 확인하고 투여 후 기록한다.","m":"관찰, 질문","loc":"병동, 중환자실, 응급실, 주사실","who":"의사, 간호사","chk":"* 의약품 투여 시 정보확인이 필요한 내용 질문\n* 의약품 투여 기록 확인","ans":"[투약과정 관찰]\n1) 처방확인: 정확한 환자정보, EMR 처방확인, 환자상태 확인\n2) 의약품준비\n 가) 손위생준수\n 나) 유효기간 및 성상 확인, 투약직전 준비, 한 번에 한 환자\n 다) 투약 전 의약품에 라벨 부착\n3) 투약\n 가) 처방-의약품 간, 의약품-환자 간 5-right 준수(환자, 의약품, 용량, 시간, 투여경로)\n 나) 의약품을 준비한 담당자가 계획된 시간을 준수하여 직접 투약하고 PHIS 투약실시 기록"},"4.5 ME4":{"t":"고위험의약품 투여 시 주의사항 및 부작용 발생 시 대처 방안을 알고 수행한다.","m":"관찰, 질문","loc":"병동, 중환자실, 응급실, 주사실","who":"의사, 간호사","chk":"* 고위험의약품 투여 시 주의사항 확인\n* 고위험의약품 부작용 발생 시 대처방안 확인(관련 내용을 찾아서 제시할 수 있는지 확인)","ans":"[PHIS확인]진료공통>고위험의약품조회-고위험의약품 주의사항 및 부작용 발생 시 대처 제시"},"4.5 ME5":{"t":"투약 설명을 수행한다","m":"관찰, 질문","loc":"약제부서, 병동, 중환자실, 응급실, 주사실","who":"약사, 의사","chk":"* 투약 설명 내용 확인\n* 투약 설명을 수행하는 직원의 이름 확인\n* 의료기관이 정한 의약품에 대해 약사 또는 의사가 수행한 투약 설명 확인(관련자료_[안내문 등]가 있는 경우 확인), 항결핵제 투약(약제부에서 검토하여 제공한 항결핵제 복약안내문을 활용하여 간호사가 설명 가능)\n(인적자원관리 ST_관련자료)\n* 현장에서 확인한 직원의 인사정보 확인","ans":"1) 대상 \n가) 대상의약품을 투약중인 입원 및 외래원내조제 환자 중 담당의사가 복약상담 의뢰한 환자\n나) 대상의약품: 항응고제, 항혈전제, 당뇨(인슐린 제제 포함), 흡입기(소아천식치료제 포함), 항결핵제, 항암제, 면역억제제, 허가초과 항암제 등(의사는 허가초과항암제를 처방하기 전 환자에게 설명하고 동의받음)\n2) 내용: 의약품 효능, 부작용, 용법, 주의사항 등\n3) 수행자: 약사, 의사 \n※ 항결핵제: 약사가 최종 확인한 복약설명서를 활용하여 간호사가 설명할 수 있음\n*직무기술서 또는 진료권한정의서 확인(자격 및 면허, 교육 등)"},"4.5 ME6":{"t":"의약품 사용 후 안전하게 폐기한다","m":"관찰, 질문","loc":"병동, 중환자실, 응급실, 주사실","who":"간호사","chk":"* 사용한 모든 의약품(다회사용 의약품 포함)의 폐기방법 확인","ans":"1) 의약품 폐기: 골판지류 전용 용기에 폐기\n2) 사용한 액상 의약품의 잔량 폐수처리가 불가한 경우: 합성수지류 전용용기에 폐기\n3) 유리용기의 파손 발생 시 액상 의약품 잔량 여부와 관계없이 합성수지류 전용용기에 폐기\n4) 고위험의약품은 사용 후 즉시 폐기(단, 다회투여 의약품은 허가사항 상의 개봉 후 유효기간에 따라 폐기)\n5) 바늘은 손상성 폐기물로 구분하여 폐기"},"4.5 ME7":{"t":"지참약을 관리한다","m":"관찰, 질문","loc":"병동, 중환자실, 약제부서","who":"간호사,약사 / 의사","chk":"* 지참약 확인(식별) 및 처방, 투여 절차 확인\n* 지참약 정보 공유방법 확인\n* 지참약 보관방법 확인\n* 환자 또는 보호자 교육 시행 내용 확인\n* (지참약을 허용하지 않는 경우) 환자가 자의로 지참약을 복용하지 않도록 관리하는 절차 질문\n[의사]\n* 지참약 정보 공유 방법 확인\n* 지참약 처방 원칙 확인(지참약 처방 내역 등이 전산으로 확인 가능한 경우 출력물을 요구하지 않고 전산으로 확인하여 조사)","ans":"[PHIS확인] 지참약 처방화면, 식별의뢰결과 화면 제시\n1) 의료진은 환자 입원 시 절차에 따라 지참약 복용 여부 확인하고 모두 수거\n2) 건강보험심사평가원의 DUR 이용에 대해 동의를 받은 경우 DUR 정보를 확인하여 식별\n3) DUR 동의를 받지 않은 경우, 지참약 및 약품식별의뢰지와 함께 약제부 일반조제유니트 또는 입원지원센터 약제상담 창구에 식별 의뢰\n4) 약제부는 식별의뢰 접수하고 당일 식별 완료하여 결과보고서를 전산으로 회신. 지참약과 약품식별의뢰지는 병동으로 회신\n5) 입원 당일 지참약 식별이 불가능하거나 긴급한 경우 약제부 의뢰 또는 의료진이 식별\n6) 지참약 보관 유무를 확인하여 환자가 자의로 복용하지 않도록 환자 및 보호자에게 설명\n7) 지참약은 퇴원 시까지 환자가 직접 보관하지 않도록 함. 별도의 지참약 보관장에 두고 간호사가 관리. 허용되지 않은 지참약은 집으로 가져가도록 보호자에게 돌려주고, 불가피한 경우 병동에서 보관 후 퇴원 시 돌려줌\n[의사]\n[PHIS확인] 지참약 처방화면, 식별의뢰결과 화면 제시\n1) 지참약의 투약 여부는 해당 의사가 판단(지참약은 재조제 하지 않음, 마약류 지참약은 투여를 허용하지 않음)\n2) 본원 처방 의약품과의 병용금기, 성분 및 효능군 중복에 대해 DUR을 통해 처방 검토함"},"5.1 ME1":{"t":"수술 전 평가를 기반으로 수술계획을 수립한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사","chk":"* 수술 전 평가 및 수술 계획 기록 확인\n- 의무기록(초진기록, 경과기록, 협진기록 등)에서 확인 가능하면 인정\n- 응급 수술이 필요한 환자의 수술 전 평가는 의료기관의 규정에 따라 간소하게 시행할 수 있음","ans":"[PHIS확인] 입원기록, 경과기록, 협진기록\n환자의 병력, 신체적 상태, 진단검사 결과 및 자료, 추정진단명 등을 평가하여 수술계획 기록"},"5.1 ME2":{"t":"수술 전에 진단명을 기록한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사","chk":"* 수술실 입실 전 진단명 기록 여부 확인","ans":"수술실 입실 전에 '수술 전 진단명'을 수술신청화면에 기록"},"5.1 ME3":{"t":"수술실 퇴실 전에 수술에 대한 내용을 기록한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사","chk":"* 수술실 퇴실 전(수술장 내 회복실 포함) 수술기록 작성 여부 및 작성 내용 확인\n- 수술기록의 서식은 의료기관에서 정할 수 있으며(수술기록지, 경과기록지, brief OP note 등), 기록을 수정한 경우 최초 작성 시간 및 내용 등을 확인하여 조사","ans":"[PHIS확인] 수술기록지\n* 수술실(회복실) 퇴실 전까지 기록(brief OP note도 가능)\n* 작성내용\n① 수술명\n② 집도의/보조의/전담간호사 성명\n③ 수술(절개) 시작 (연월일시) / 수술종료(연월일시)\n④ 수술 전 진단명/ 수술 후 진단명\n⑤ 검사를 위해 채취한 조직표본 검체\n⑥ 출혈정도\n⑦ 기타 특이사항\n⑧ 수술기록 작성일시 및 서명"},"5.1 ME4":{"t":"수술 후 평가를 기반으로 24시간 이내에 치료계획을 수립한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"의사","chk":"* 수술 후 환자평가 내용 확인 \n* 24시간 이내 수립한 치료계획 확인","ans":"[PHIS확인] 수술 후 경과기록(치료계획)\n* 수술 후 24시간 이내 작성\n- 수술 이후(회복실 퇴실 이후)의 환자 상태,\n- 수술 후 발생하거나 가능성이 있는 합병증, 검사결과, 주의관찰사항 등"},"5.1 ME5":{"t":"수술 후 평가를 기반으로 간호계획을 수립한다","m":"관찰, 질문","loc":"병동, 중환자실","who":"간호사","chk":"* 수술 후 환자평가 내용 확인 \n* 수립한 간호계획 확인","ans":"[PHIS확인] 간호기록지\n* 수술 후 환자평가를 수행하여 이를 기반으로 간호진단 및 간호계획을 수립하고 대처방안에 따라 수행한다.","m":"관찰, 질문","loc":"진정치료 시행 장소","who":"의사, 간호사","chk":"(관찰)\n* 응급상황 발생 시 대처를 위한 의약품 및 물품 등 비치 확인\n* 응급상황 발생 시 대처방안 확인","ans":"1) 진정은 산소공급 장치를 사용할 수 있는 곳에서 시행\n2) 응급상황에 사용되는 약물, 장비, 길항제 구비\n3) 응급상황 발생 시 시술이나 검사를 즉각 중단하고 진정 시행 의사의 책임하에 필요한 조치 취함\n4) 심폐소생술 필요 시, 코드 블루 요청"},"5.4 ME6":{"t":"진정 회복 후 퇴실 기준에 따라 적격한 자가 퇴실을 결정한다.","m":"관찰, 질문","loc":"진정치료 시행 장소","who":"의사, 간호사","chk":"* 진정 회복 후 모니터링 종료 기준에 따른 평가 수행 및 기록 확인\n* 모니터링 종료를 결정한 직원의 이름 확인","ans":"(회복실 퇴실) 진정기록지 제시\n퇴실 기준 평가: 자격을 가진 의료진(의사, 간호사)이 실시\n1) Modified Aldrete scoring system :\n - 입원 중 진정치료 시행 성인, 소아\n2) PADSS(Postanesthetic Discharge Scoring System\n - 집으로 가는 성인(낮병동 , 외래 환자 등)"},"6.1 ME2":{"t":"직원은 환자의 권리와 의무를 알고 있다","m":"서류","loc":"전부서","who":"전직원","chk":"* 환자의 권리와 의무에 대해 설명할 수 있는지 확인\n (관련 내용을 찾아서 제시할 수 있는지 확인)","ans":"[환자의 권리와 의무 게시물 참조하여 답변]\n[PHIS확인] 직무기술서_교육현황에서 확인(필수교육)"},"6.1 ME3":{"t":"환자에게 환자의 권리와 의무에 대한 정보를 제공한다","m":"관찰, 질문","loc":"전부서","who":"전직원","chk":"(관찰) \n*환자 권리와 의무 게시, 안내문 비치 등 \n(원무 직원, 간호사) \n*입원수속 또는 병동생활 안내 시 환자 또는 보호자에게 환자의 권리와 의무에 대한 정보 제공 방법 확인","ans":"1) 외래, 입원 등: 환자의 권리와 의무 게시물 부착 확인\n2) 입원환자: 입원생활안내문 제공"},"6.1 ME4":{"t":"진료과정에 환자가 참여한다","m":"관찰, 질문","loc":"전부서","who":"환자, 의사","chk":"(의사) \n* 진료과정에서의 설명 여부 및 설명 내용 확인\n(환자 또는 보호자)\n* 질병, 의료행위에 대해 충분히 설명을 듣고 결정했는지 확인(환자가 진료과정 참여 여부를 인지하지 못하는 경우 동의서, 의무기록 등 근거 자료 확인)","ans":"(환자면담) 질병, 치료, 검사, 수술, 입원 등의 의료행위에 대해 충분히 설명을 들었는지 확인\n(의사) 설명제공 여부-동의서, 의무기록 등을 통해 확인"},"6.1 ME5":{"t":"환자의 사생활보호 요구를 확인한다","m":"관찰, 질문","loc":"전부서","who":"원무팀,\n간호사, 의사","chk":"* 환자(또는 보호자)의 사생활보호 요구사항을 파악하는 방법 확인\n* 환자(또는 보호자)가 요구 시 사생활 보호 방법 확인\n(관련내용 찾아서 제시할 수 있는지 확인)\n* 환자의 사생활 보호 요구 시 공유 방법 확인","ans":"1) 원무팀 입원수속/병동 간호정보조사 시 사생활보호요구 파악\n2) 전산등록: PHIS-병원공통-환자정보수정(정보공개제한요청 선택)\n3) 환자명단에 “S”표시되면 입원정보, 진료정보 등을 비밀로 해야 함을 공유함\n4) 사생활보호 요구사항은 환자 또는 보호자의 요구에 따라 상시 변동 가능함"},"6.1 ME6":{"t":"환자의 신체노출을 방지한다.","m":"관찰, 질문","loc":"전부서","who":"간호사, 의사, 검사실 직원","chk":"(관찰)\n* 외래 진료실 내 다른 환자 대기 금지 확인\n* 진료 및 검사, 처치 시 신체노출을 방지하기 위한 절차 확인(진료 및 검사, 처치 시 수치심을 느끼지 않도록 배려하는 절차_ 스크린, 커튼, 처치실 등)","ans":"1) 외래진료실 내 다른 환자 대기 금지\n2) 진료 및 처치 시 스크린이나 커튼제공, 필요시 진료 및 처치실 문 잠금(외래, 검사실, 시술실, 수술실, 병실)을 하여 환자가 수치심을 느끼지 않도록 배려"},"6.1 ME7":{"t":"환자의 개인정보를 보호한다","m":"관찰, 질문","loc":"전부서","who":"전직원","chk":"(관찰)\n* 공개된 장소에서 환자의 개인정보 보호를 위한 수행 확인\n* ‘외래 진료실 내 동반 가능 보호자 안내’는 환자의 개인정보를 보호하기 위하여 불필요하게 많은 인원이나 관계자가 출입하지 않도록 하기 위한 안내(안내문 게시 등)를 의미하며, 매번 관계를 확인하여야 하는 것은 아님","ans":"1) PHIS 패스워드는 영문자, 숫자, 특수문자조합의 9자리 이상으로 설정하고 3개월마다 변경\n2) 이석 시 반드시 로그아웃 하여야 하며(화면잠금: 윈도우키+L 단축키), 화면보호기 설정(10분)\n3) 환자의 진료정보를 포함한 개인정보가 공개된 장소에 있지 않도록\n4) 입원환자이름표의 경우 침상에는 이름이 모두 표시되나, 병실 입구에는 환자이름의 세번째 글자를 *로 표시_ 예 “홍길*”\n5) 입원 검사현황표, 환자현황표(응급실, 분만실, 외래 대기환자, 채혈실), 수술실 TV 채널의 경우도 세번째 글자를 *로 표시\n6) 외래진료실 앞 불필요한 인원 출입을 금지하는 내용 부착"},"6.2 ME2":{"t":"학대 및 폭력피해자 발생 시 보고 및 지원체계를 준수한다.","m":"관찰, 질문","loc":"전부서","who":"전직원\n응급실, 산부인과(의사, 간호사)","chk":"(전직원-의료인 중심)\n* 아동학대 환자(의심환자 포함) 발생 시 보고 및 대처, 지원체계 등 확인\n* 노인학대, 가정폭력 환자 발생 시 보고 및 대처, 지원체계 등 확인\n* 성폭력 환자 발생 시 보고 및 대처, 지원체계 등 확인\n- 관련 내용을 찾아서 제시할 수 있는지 확인\n(응급실/산부인과의 의사, 간호사)\n* 성폭력 환자 발생 시 경찰서 신고 또는 성폭력 피해자를 위한 통합지원센터가 설치된 경우 센터 연계 확인","ans":"[학대/폭력 피해자 발견 시 보고절차]\n*신체·정신·성적 폭력, 가정폭력, 가혹행위, 유기, 방임 의심 아동(18세 미만), 노인, 여성 환자\n1) 환자에 대한 응급치료 및 의학적 검사와 증거채취 및 치료/의사의 판단하에 즉시 112 신고\n2) 아동(18세 미만) 학대 의심시: phis 통합메뉴>위험관리>아동학대신고서 작성\n3) 사례접수(주간: 본원 사회사업실 7494 또는 해바라기센터 연계, 야간: 응급행정실 7158 또는 해바라기센터 연계)\n4) 학대/폭력여부 평가\n5) 신고결정시 신고 및 행정절차 진행\n6) 해당전문기관 파견조사 시 관련사항 협조(증빙자료 제출)"},"6.2 ME3":{"t":"신생아와 소아환자의 유괴예방 절차를 준수한다.","m":"관찰, 질문","loc":"전부서","who":"소아병동/소아중환자실/신생아실(간호사, 의사, 직원)","chk":"(관찰)\n* 방문자 신분 확인, 원내 이동시 직원/보호자와 동반 등 확인\n(신생아 및 소아를 진료하는 부서 직원) \n유괴 예방 절차 확인\n- 관련 내용을 찾아서 제시할 수 있는지 확인","ans":"[신생아 유괴 예방절차] \n1) 신생아실/신생아중환자실의 출입문은 닫힌 상태를 유지하며, 출입구 CCTV와 RFID(출입통제기기)가 부착된 이중문을 설치하여 출입을 관리\n2) 신생아실/신생아중환자실 환아는 환자인식팔찌 부착\n3) 신생아실/신생아중환자실은 면회는 환아의 부모에 한해 시행\n4) 진료 및 검사를 위해 병동 외부로 이동시에는 보호자 또는 확인된 직원(유니폼, 신분증의 사진과 실물을 대조하여 확인)이 동반\n [소아(영유아) 환자 유괴 예방절차]\n1) 소아(영유아) 환자 입원 시 보호자에게 유괴예방교육을 시행\n2) 소아(영유아)환자는 입원즉시 환자인식팔찌를 부착하고 보호자 1인이 반드시 I활동 부서","who":"적정관리팀\nQI활동 수행부서원","chk":"* 의료기관에서 선정한 질 향상 활동 방법 확인\n* (QI활동 수행 부서원)\n- 부서에서 적용한 질 향상 활동방법 질문\n※ 질 향상 활동 보고서를 보고 설명해도 됨","ans":"1) QI활동방법 : FOCUS-PDCA(Find-Orgarnize-Clarify-Understand-Select-Plan-Do-Check-Act)\n2) 통합메뉴-의료질관리-QI활동자료조회 : QI활동보고서 설명"},"7.4 ME3":{"t":"질 향상 활동 분석도구를 사용하여 자료를 분석한다.","m":"서류","loc":"질 향상과 환자안전 ST\nQI활동 부서","who":"적정관리팀\nQI활동 수행부서원","chk":"* 질 향상 활동 분석도구를 사용한 분석 자료 확인\n※ 질 향상 활동 보고서를 보고 설명해도 됨","ans":"1) 통계적기법과 도구(인과관계도,순서도, 히스토그램, 런차트, 파레토도 등) 중 무엇을 사용하여 자료를 분석하였는지 설명\n2) QI활동보고서 보면서 설명 가능"},"8.4 ME2":{"t":"호흡기 치료기구 관련 감염관리를 수행한다","m":"관찰","loc":"병동, 중환자실, 신생아중환자실, 응급실","who":"의사, 간호사","chk":"* (관찰)\n- 호흡기 치료기구 관련 감염관리 수행 내용 확인","ans":"[수행 관찰]\n1) 흡인 전후 손위생 및 장갑착용\n2) 흡인 카테터는 개방형 시스템일 경우 매회 교환하고, 폐쇄형 읍인 카테터는 제조사의 권고에 따라 교환\n3) 흡인용 멸균 생리식염수는 매회 교환\n4) 기관절개관 삽입 및 절개부위를 근무조마다 확인하고 기록함\n5) 앰부백과 마스크는 환자마다 개별적으로 사용하고, 사용 후 EO 가스멸균이나 고압증기멸균 시행 \n5) 인공호흡기 가습용 증류수는 멸균 증류수를 사용하고, 인공호흡기 회로(ventilator circuit)는 오염이 있거나 작동불량인 경우 교체한다. 다만 제조사 사용설명서에 명시된 최대 사용기간을 초과하지 않는다. \n6) nebulizer는 매회 사용 후 약물 주입부분, 흡입구 부분은 수돗물로 세척 후 물기를 제거, 약물주입부 내/외부, 흡입구 겉면, 연결줄 겉면은 알코올솜으로 닦음. 키트는 매일 새것으로 교환\n7) 일회용 산소습윤병: 환자별(병동, 중환자실), 침상별(그 외 부서) -> 7일 마다 교환함. 침상별로 사용하는 경우, 호흡기질환 (의심)환자가 사용한 후에는 교환함"},"8.4 ME3":{"t":"유치도뇨관 관련 감염관리를 수행한다","m":"관찰","loc":"병동, 중환자실, 신생아중환자실","who":"의사, 간호사","chk":"* (관찰)\n­ 유치도뇨관 관련 감염관리 수행 내용 확인","ans":"[수행 관찰]\n1) 유치도뇨관 삽입 전후, 도뇨관 조작 전후 손위생 및 장갑착용\n2) 유치도뇨관은 멸균물품을 이용하여 무균적으로 삽입함\n3) 소변백은 항상 방광 아래위치, 바닥에 소변백이 닿지 않도록 함, 유치도뇨관 및 소변백의 폐쇄상태 유지\n4) 소변을 비우고 난 소변백의 소변출구 꼭지는 알코올솜으로 닦은 후 뚜껑을 씌움\n5) 유치도뇨관 삽입 부위는 일상적인 청결 관리(물과 비누, 세정제를 이용한 세척 등)로 충분하며, 필요 시 소독제(povidone iodine) 또는 생리식염수를 사용하여 관리\n6) 소변검체는 멸균된 주사기를 사용하여 무균적으로 채취"},"8.4 ME4":{"t":"혈관 내 카테터 관련 감염관리를 수행한다","m":"관찰","loc":"병동, 중환자실, 신생아중환자실","who":"의사, 간호사","chk":"* (관찰)\n­ 혈관 내 카테터 관련 감염관리 수행 및 기록 확인\n※ 카테터 삽입 주위에 삽입일시를 기재하여도 인정(반드시 의무기록을 의미하는 것이 아님)","ans":"[말초정맥관]\n1) 정맥관 삽입, 조작, 교정 전후 손위생\n2) 수액세트, 수액주입 시간 : 정책 04-12 카테터 및 수액세트 교체주기 확인 \n3) 혈관에 연결된 주사기구의 주사포트, 카테터 허브, 바늘없는 주사커넥터 관리: 소독제(알코올, CHG, 포비돈)로 5초 이상 닦기\n4) 정맥관 삽입부위에 삽입일시를 기재하고, 정맥 주사 부위 확인 사항(discomfort, edema, itching 등)을 근무조마다 관찰 및 기록\n[미드라인카테터]\n1) 합병증이 없다면 최대 4주까지 사용 가능\n2) 드레싱 부위에 드레싱 시행일시와 미드라인 카테터임을 표시\n[중심정맥관]\n1) 중심정맥관 삽입 시 시술자는 모자, 일반 마스크, 멸균가운, 멸균장갑 착용/멸균대공포로 환자의 머리부터 발끝까지 덮음. 처치 전후 손위생\n2) 중심정맥관 삽입부위 확인사항을 매 근무조마다 관찰 및 기록\n3) 중심정맥관 드레싱의 상태(건조상태, 부착상태)를 근무조마다 관찰하여 기록. 거즈 드레싱(2일마다), 투명 필름 드레싱(최소 주 1회 이상) 교체\n[제대카테터]\n1) 삽입, 처치 전후 손위생 및 장갑착용\n2) 삽입부위 확인사항을 매 근무조마다 관찰 및 기록\n3) 눈으로 보이는 오염 있거나 감염 의심될 경우 포비돈 소독\n4) 제대동맥 카테터 5일 이내, 제대정맥 카테터 14일 이내 사용\n[동맥카테터]\n1)삽입 시 손위생, 피부소독 시행.\n2) 시술자는 모자, 마스크, 멸균장갑 착용. 멸균 소공포로 시술부위 덮음.( 단, 대퇴 또는 액와 동맥에 삽입하는 경우 -> 시술자는 멸균가운(추가) 착용, 시술부위는 멸균 대공포로 전신을 덮음.) \n3) 감염위험을 줄이기 위해서 대퇴 또는 액와보다 요골, 상완, 발등 동맥 부위 삽입 권고.(단, 소아의 경우 상완 부위 삽입 금기)\n4) 주기적으로 교환하지 않으나 가능한 빨리 제거\n5) 삽입부위 확인사항 및 드레싱 상태 근무조마다 관찰 및 기록"},"8.5 ME5":{"t":"멸균물품을 관리한다","m":"관찰","loc":"병동, 외래, 중환자실, 수술실, 응급실, 검사실","who":"간호사, 보건직","chk":"* (관찰) 멸균 물품 사용부서\n- 오염 물품과 멸균 물품을 구분하여 보관 확인\n- 유효기간 확인\n- 과적 여부 확인","ans":"[중앙공급실 이외의 멸균물품 관리]\n1) 오염물품/청결물품과 구분하여 보관\n2) 멸균물품 유효기간이 경과한 물품 폐기\n3) 서랍칸 뒤로 넘어가지 않도록 유의\n4) 멸균물품 만지기 전 손위생"},"8.5 ME7":{"t":"세탁물을 적절하게 관리한다","m":"관찰","loc":"세탁물 보관 장소, 병동, 외래, 중환자실, 수술실, 응급실, 검사실","who":"세탁물수집장소 직원, \n세탁물보관장소 직원","chk":"* (관찰, 세탁물 담당 직원, 관련 자료 확인)\n­ 의료기관세탁물 수집 상태 확인\n※ 위탁처리 업체가 세탁물 수집 장소에서 직접 수거하여 보관 장소(집하장)가 없는 경우에는 세탁물 수집 장소만 조사함\n­ 의료기관세탁물 보관 상태 확인\n※ 의료기관의 세탁물 관리 시스템 상 중앙에 별도의 장소를 두지 않고 각 부서에서 관리하는 것도 인정\n­ 의료기관세탁물 운반 용기 관리 상태 확인\n­ 세탁 금지 세탁물 처리 방법 확인 \n­ 세탁물 처리 업무관련 직원 교육 이수 자료 확인\n※ 교육을 이수하지 않은 경우 ‘상’으로 판정할 수 없음","ans":"[사용한 세탁물 수집]\n1) 지정된 세탁물 수집 장소에 세탁물 분류방법 및 취급상 주의사항 게시\n2) 수집용기에 넘치지 않도록 세탁물 수집하고 뚜껑을 닫아둠\n3) 사용한 세탁물을 만지고 난 후에는 손위생 \n4) 환자에게 사용하는 모든 세탁물은 오염세탁물로 취급→ 오렌지색 방수포에 넣어 밀봉\n5) 혈액이나 체액으로 오염될 가능성이 있는 직원근무복은 오염세탁물로 취급->오렌지색 방수포에 넣어 밀봉\n[사용한 세탁물 운반]\n1) 밀봉 후 운반\n2) 세탁물 운반 시 마스크와 장갑 착용\n3) 오염세탁물, 청결세탁물 운반용기를 구분하여 사용\n4) 세탁물 운반 용기는 주1회 이상 소독\n5) 중앙집하장: 주2회이상 소독\n[세탁 금지 세탁물 처리]\n1) 세탁 금지 세탁물 정의\n - 피, 고름이 묻은 붕대 및 거즈\n - 마스크, 수술포 등 일회용 제품류\n - 바이러스성 출혈열(에볼라바이러스병, 마버그열, 라싸열, 크리미안콩고출혈열, 남아메리카출혈열 및 리프트밸리열) 환자 혈액,체액으로 오염된 세탁물\n - 크로이츠펠트 야콥병(CJD (의심))환자 세탁물\n2) 세탁금지 세탁물 처리-의료폐기물통에 폐기\n[청결 세탁물 보관]\n1) 종류별로 덮개가 있는 장소에 보관"},"8.6 ME2":{"t":"환자치료영역의 청소 및 소독을 수행한다","m":"관찰","loc":"전부서","who":"청소 및 소독 담당직원","chk":"* 환자진료(치료)가 이루어지는 모든 장소\n­ 청소 및 소독 수행 확인\n­ 개인보호구 비치 확인 \n­ 청소ㆍ소독 시 개인보호구 착용 여부 확인\n­ 청소용구 및 소독용구 관리 상태 확인","ans":"1) 청소 및 소독 주기\n-일반병실 등: 1회 이상/일\n-격리병실, 수술실, 심혈관촬영실, 인터벤션실, 혈액투석실, 조혈모세포이식실, 응급실: 2회 이상/일\n2) 청소도구는 구역구분하여 사용함 \n-장갑: 화장실(적색 고무장갑), 그 외(노란색 고무장갑 또는 라텍스)\n-손걸레: 화장실 변기(회색), 화장실 변기 외(적색), 병실(초록색), 기타(파란색)\n-대걸레 마포: 화장실(적색), 격리병실(노란색), 일반병실(회색), 기타(파란색)/대걸레 손잡이에 스티커로 표시\n3) 개인보호구 착용: 청소 및 소독 시에는 장갑착용, 오염물질 또는 환경소독제 노출가능성 있는 경우, 가운 또는 앞치마, 마스크, 보안경 착용\n4) 오염품품과 청결물품 분리보관, 개인물품/식음료는 카트에 넣어두지 않음"},"8.8 ME5":{"t":"감염병 전파경로에 따른 절차를 준수하여 환자를 관리한다","m":"관찰","loc":"격리 및 역격리 병실, 중환자실, 응급실","who":"의사, 간호사","chk":"* (관찰)\n­ 격리표지 확인\n­ 준비물품 확인\n※ 격리환자가 없는 경우, 환자 발생 시 지원 방법 확인\n* (의사, 간호사)\n­ 격리병실 배치 기준 확인 \n­ 격리병실 제공이 불가능한 경우 대응 방안 확인\n­ 정보공유방법 확인\n­ 전파경로에 따른 보호구 종류, 착용 및 탈의(제거) 방법 확인\n­ 환자 이송방법 확인\n­ 환자에게 사용한 의료기기 또는 물품 관리 확인\n­ 환경 관리 확인\n­ 환자 및 보호자 대상 교육 및 방문객 관리 확인\n­ 직원 교육 시행 및 내용 확인","ans":"[병원전체]\n1. 격리가 필요한 대상 및 격리유형\n 1) 공기주의(표시 A) : 활동성 폐결핵,수두,홍역,파종성 대상포진 등\n 2) 접촉주의(표시 C) : C.D, VRE, MRSA, CRE, Rotavirus\n 3) 비말주의(표시 D) : 인플루엔자, 풍진, 코로나 19\n 4) 보호격리(역격리): 고형장기 이식환자, 면역저하 환자 \n2. 직원간 공유방법: 격리표지(병실입구, 침상의 이름표 옆), 격리표지스티커, 전산화면(caution), 환자 바코드 내 표기\n3. 개인보호구\n 1) 공기주의: 직원(n95 마스크), 환자(일반 마스크)\n 2) 비말주의: 직원(일반 마스크, 필요 시 가운, 장갑), 환자(일반 마스크)\n 3) 접촉주의: 직원(가운, 장갑), 환자(병실을 나갈 때 가운)\n4. 환자 및 보호자 대상 교육\n 1) 격리 시작 또는 필요 시 교육\n 2) PHIS < Caution에 들록된 '전파경로별 환자/보호자를 위한 안내문' 사용"},"8.8 ME8":{"t":"보호격리가 필요한 환자를 관리한다","m":"관찰","loc":"격리 및 역격리 병실, 중환자실, 응급실","who":"의사, 간호사","chk":"* 양압 유지 여부 확인 \n* 격리표지 확인\n* 준비물품 확인\n※ 보호격리 환자가 없는 경우, 환자 발생 시 지원 방법 확인","ans":"[병원전체]\n1. 보호격리가 필요한 대상: 고형장기 이식환자, 면역저하 환자\n2. 개인보호장구: 마스크(공통)\n 장갑(신이식)+가운(그 외 고형장기)\n3. 양압 확인 및 기록\n 1) 상시 가동부서(10병동, 조혈모세포이식실): 매일 1회\n 2) 필요 시 가동부서(그 외): 격리시작 전, 격리 중(매일 1회)\n빈 병실인 경우(주 1회)\n 3) 시설관리팀: 월 1회"},"9.2 ME4":{"t":"직원은 미션과 핵심가치를 알고 있다.","m":"관찰, 질문","loc":"전부서","who":"전 직원","chk":"* 미션 및 핵심가치를 알고 있는지 확인\n※ 미션 및 핵심가치 게시물 등 참고하여 설명하는지 확인","ans":"그룹웨어 첫페이지 좌측 하단(미션 클릭시 홈페이지로 이동), 홈페이지(병원소개), 직원ID 카드, 화면보호기 참조가능\n[미션]\n우리는 생명을 존중하며, \n최상의 교육,연구,진료로 \n인간의 건강과 행복에 기여한다.\n[비전]\n최상의 의료로 신뢰받는 병원이 된다.\n의생명 연구를 주도하는 병원이 된다.\n창의적인 인재를 양성하는 병원이 된다.\n[핵심가치]\n고객중심, 근거중심의학, 직업전문성, 협력, 존중, 열정"},"9.3 ME1":{"t":"부서장은 부서의 업무범위를 정의한다","m":"서류","loc":"전부서, \n인적자원관리ST","who":"부서장\n담당직원\n-인력개발팀","chk":"* 필요 인력의 자격 요건 및 인원수 관련 자료 확인\n※ 전공의가 있는 진료과 : 수련규칙 확인\n* 업무 절차 확인\n* (부서장)\n­ 부서 업무 관련 서류 확인","ans":"부서 업무 정의서"},"9.3 ME2":{"t":"부서의 운영계획이 있다","m":"서류","loc":"전부서","who":"부서장","chk":"* 부서 운영계획 관련 자료 확인","ans":"부서 업무 계획서"},"9.3 ME3":{"t":"부서 운영계획에 따라 업무를 수행한다","m":"서류","loc":"전부서","who":"부서장","chk":"* 부서 운영계획에 따른 업무수행 확인","ans":"부서 업무 계획서"},"9.3 ME4":{"t":"부서장은 업무수행 내용을 평가한다","m":"서류","loc":"전부서","who":"부서장","chk":"* 업무수행에 대한 주기적 평가 내용 확인","ans":"부서 업무 보고서(상반기추진실적, 하반기추진실적)"},"10.7 ME5":{"t":"직원 안전사고 발생 시 보고하고 치료 및 관리 한다.","m":"관찰, 질문","loc":"전부서","who":"전 직원","chk":"*직원 안전사고 발생 시 보고절차 확인\n-관련 내용을 찾아서 제시할 수 있는지 확인","ans":"[PHIS] 통합메뉴-위험관리-직원안전사고보고\n* 직원안전사고 보고체계 포스터 참조\n -직원감염노출보고서(혈액매개)\n -직원감염노출보고서(공기비말접촉)\n -업무상재해조사보고서(항암제 노출 시에는 업무상 재해 경로를 따름)\n -인권침해 등 행위 신고(폭력피해신고관리) \n -유해화학물질 노출/누출 보고서\n(공유)\n* 그릅웨어 게시판>안전게시판>안전보건정보\n* 공문으로 분기별 직원안전 질지표 자료 통계분석 자료 공유\n* 신규/재직 직원 교육 자료로 활용"},"11.1 ME6":{"t":"직원은 시설 및 환경안전 사고 발생 시 보고절차를 알고있다.","m":"관찰 질문","loc":"전부서","who":"전직원","chk":"* 시설 및 환경안전 사고 발생시 보고절차 확인\n ⅴ관련 내용을 찾아서 제시할 수 있는지 확인","ans":"최초발견자 신고(방재실☎8419)→방재실에서 해당부서에 전달→ 필요 시 즉시 작업중지, 주변인원을 안전지대로 대피, 부상자 발생 시 응급처치 후 응급실 이송→직원/환자/내원객 별 안전사고 보고절차에 따라 보고\n[직원/환자/내원객 안전사고 보고절차]\n1) 직원안전사고(기준 10.7 ME5 참조): 부서장 및 사고유형별 담당자(보건관리자, 안전관리자 외)신고. PHIS-통합메뉴-위험관리-직원안전사고보고서 등록 \n2) 환자안전사고(기준 7.3 ME2 참조):, 부서장 및 적정관리팀 보고, PHIS-통합메뉴-위험관리-환자안전사고보고서 등록\n3) 내원객안전사고: 민원제기 시 고객만족팀으로 안내"},"11.3 ME4":{"t":"의료폐기물을 안전하게 관리한다.","m":"관찰 질문","loc":"폐기물 수집장소 "소방안전 교육을 시행한다.","m":"서류","loc":"인적자원관리 ST","who":"시설관리팀 전직원","chk":"* 계획에 따른 전 직원 소방안전 교육 시행 자료 확인","ans":"관련문서 확인 \nPHIS 확인-직무기술서-교육현황"},"11.6 ME6":{"t":"직원은 화재 발생시 대응체계를 알고 있다.","m":"관찰 질문","loc":"전부서","who":"전직원","chk":"* 환자(또는 보호자)의 대처요렁 안내 확인\n* 화재발생 시 대응체계 확인\n ⅴ소화기 사용, 직원 출동 등 시연 금지","ans":"[화재시 대처요령 안내] 포스터(화재발생시 대응체계), 층별 비상대피안내도 부착 확인, 입원안내문 준비\n[화재발생시 대응체계] 전파→진압→대피\n1) 전파\n ①\"불이야\"라고 외쳐 주위에 알리고, 소화전 비상벨 누름, 1인 지목하여 신고요청\n ②화재발생신고(CODE RED) : 원내 7119(통화시 8119), 119(소방서) 동시신고\n2) 진압: 인근소화기 및 소화전을 이용하여 초기화재진압을 실시\n3) 대피: 환자를 안전한 곳으로 대피시킨다. \n ①피난층: 하부층이나 1층 또는 옥상층 \n ②안전구획: 방화문 밖의 복도, 주계단, 비상계단 등\n ③피난시설 위치 및 피난경로 : 가장 가까운 계단 이용하여 피난층 또는 지정된 최종대피처로 이동\n ※통제된 출입구는 화재시 모두 자동개방됨. 부서별 비상계단 위치 및 최종대피처 숙지\n4) 화재시 업무분담(통보연락반/소화반/피난유도반)은 각 부서의 화재시 업무분담 시나리오에 따름. ※본인 역할 숙지\n5) 환자유형별 대피 방법\n -대피순서: 보행가능환자→경환자→중환자→직원\n -[1] 보행가능환자 : 대피반의 유도에 따라 스스로 이동\n -[2] 경환자(의식있고 거동가능): 부축 또는 휠체어이용\n -[3] 중환자(의식없고 거동불가능): 침대/이동용 들것이용\n \n6) 산소 등 의료가스 안전한 보관 및 취급방법\n ①환자에 비상조치 후 메인산소밸브 차단(최종 차단직원 지정)\n ②보관, 사용중 용기는 전도되지 않도록 조치를 취함"},"11.6 ME8":{"t":"금연관리를 수행한다.","m":"관찰 질문","loc":"시설 및 환경관리 ST","who":"전직원\n총무팀","chk":"* 금연구역 지정 및 관리 상태 확인 \n* 흡연실(설치 시) 지정 및 관리상태 확인 \n* 흡연자에 대한 조치 확인(흡연환자 발견 시 대처방법 질문)","ans":"병원 모든 건물 금연구역으로 지정\n[흡연발견시 대처] 내원객이 금연구역에서 흡연을 하는 경우 금연에 대한 협조를 구하고 실외 흡연구역(장례식장 앞)으로 안내"}};

const Q=RAW.map((r,i)=>({id:i,cat:r[0],ref:r[1],ward:!!r[2],q:r[3],ans:r[4],opts:[r[4],r[5],r[6],r[7]],exp:r[8]}));

const KEY="ward25-quiz-mcq-wrong";
function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){return new Set()}}
function saveWrong(s){try{localStorage.setItem(KEY,JSON.stringify([...s]))}catch(e){}}
let wrongSet=loadWrong();

const $=id=>document.getElementById(id);
let mode="all",nPick=20,selCats=new Set(Object.keys(CATS).map(Number));
let deck=[],idx=0,cur=null,score=0,answered=false,log=[],btns=[];

function incRef(){return $("incRef").checked}
function poolFor(){
  let p=Q.filter(q=>incRef()||q.ward);
  if(mode==="wrong") return p.filter(q=>wrongSet.has(q.id));
  if(mode==="cat") return p.filter(q=>selCats.has(q.cat));
  return p;
}
function renderSetup(){
  const base=Q.filter(q=>incRef()||q.ward);
  $("cnt-all").textContent=base.length+"문제";
  $("cnt-ref").textContent=Q.filter(q=>!q.ward).length;
  $("cnt-wrong").textContent=wrongSet.size?wrongSet.size+"문제":"아직 없음";
  $("m-wrong").disabled=!wrongSet.size&&mode!=="wrong";
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("catBox").hidden=mode!=="cat";
  document.querySelectorAll("#chips .chip").forEach(b=>{const k=+b.dataset.k;b.querySelector("small").textContent=base.filter(q=>q.cat===k).length});
  const n=poolFor().length;
  $("start").disabled=!n;
  $("setupHint").textContent=n?`출제 대상 ${n}문제 · 문제와 보기 순서는 매번 섞입니다.`:(mode==="cat"?"카테고리를 하나 이상 고르세요.":"풀 문제가 없어요.");
}
function buildChips(){
  const box=$("chips");
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement("button");b.className="chip";b.type="button";b.id="cat"+k;b.dataset.k=k;
    b.innerHTML=`${v}<small></small>`;b.setAttribute("aria-pressed",selCats.has(+k));
    b.onclick=()=>{selCats.has(+k)?selCats.delete(+k):selCats.add(+k);b.setAttribute("aria-pressed",selCats.has(+k));renderSetup()};
    box.appendChild(b);
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderSetup()});
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{nPick=+b.dataset.n;document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("incRef").onchange=renderSetup;
$("start").onclick=()=>start(poolFor(),nPick);

function start(pool,n){
  deck=shuffle(pool.slice()); if(n) deck=deck.slice(0,n);
  idx=0;score=0;log=[];
  $("setup").hidden=true;$("done").hidden=true;$("quiz").hidden=false;
  show();window.scrollTo({top:0});
}
function show(){
  cur=deck[idx];answered=false;
  $("pos").textContent=`${idx+1}/${deck.length}`;
  $("prog").style.width=(idx/deck.length*100)+"%";
  $("sc").textContent=score+"점";
  $("qcat").textContent=CATS[cur.cat];
  $("qref0").hidden=cur.ward;
  $("qref").textContent="기준 "+cur.ref;
  $("qtext").textContent=cur.q;
  const ol=$("opts");ol.innerHTML="";btns=[];
  shuffle(cur.opts.slice()).forEach((t,i)=>{
    const li=document.createElement("li");const b=document.createElement("button");
    b.type="button";b.className="opt";b.id="opt"+i;
    b.innerHTML=`<span class="k">${i+1}</span><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>pick(b,t);li.appendChild(b);ol.appendChild(li);btns.push([b,t]);
  });
  $("result").hidden=true;
}

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderSrc(ref){
  const e=EV[ref];const std=ref.split(" ")[0];
  $("srcHead").firstChild.textContent="근거 · 인증Q&A 원문 "+ref;
  if(!e){$("srcBody").innerHTML='<div class="std">원문 자료가 없습니다.</div>';return}
  let h=`<div class="std">${esc(std)} ${esc(STD[std]||"")}</div><div class="item">${esc(ref.split(" ")[1])} ${esc(e.t)}</div>`;
  const f=[["조사방법",e.m],["장소",e.loc],["대상",e.who]].filter(x=>x[1]);
  if(f.length)h+=`<div class="facts">${f.map(([k,v])=>`<span><b>${k}</b>${esc(v)}</span>`).join("")}</div>`;
  if(e.chk)h+=`<div><h4>조사내용</h4><div class="txt">${esc(e.chk)}</div></div>`;
  if(e.fb&&EV[e.fb]){
    const b=EV[e.fb];
    h+=`<div class="ansbox"><h4>답변 및 준비사항</h4><div class="fbnote">원본 답변이 빈칸이라 같은 내용을 다루는 ${esc(e.fb)} (${esc(b.t)}) 답변을 근거로 했어요.</div><div class="txt" style="margin-top:6px">${esc(b.ans)}</div></div>`;
  }else if(e.ans){
    h+=`<div class="ansbox"><h4>답변 및 준비사항</h4><div class="txt">${esc(e.ans)}</div></div>`;
  }else{
    h+=`<div class="fbnote">원본에 답변이 없는 항목이라 조사내용을 근거로 했어요.</div>`;
  }
  $("srcBody").innerHTML=h;
}
function pick(btn,t){
  if(answered)return;answered=true;
  const ok=t===cur.ans;
  if(ok)score++;
  log.push({q:cur,ok,pick:t});
  if(ok)wrongSet.delete(cur.id);else wrongSet.add(cur.id);saveWrong(wrongSet);
  btns.forEach(([b,tt])=>{b.disabled=true;
    if(tt===cur.ans)b.classList.add("is-ok");else if(b===btn)b.classList.add("is-bad");else b.classList.add("dim")});
  $("verdict").className="verdict "+(ok?"ok":"bad");
  $("vtext").textContent=ok?"정답":"오답";
  $("vans").textContent=ok?cur.ans:"정답: "+cur.ans;
  $("vexp").textContent=cur.exp;$("vexp").hidden=!cur.exp;
  renderSrc(cur.ref);
  $("result").hidden=false;
  $("sc").textContent=score+"점";
  $("prog").style.width=((idx+1)/deck.length*100)+"%";
  $("next").textContent=idx===deck.length-1?"결과 보기":"다음 문제";
  $("next").focus({preventScroll:true});
  $("result").scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
$("next").onclick=()=>{idx++;idx<deck.length?show():result()};
$("quit").onclick=()=>{log.length?result():home()};
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||e.target.tagName==="INPUT")return;
  if(!answered&&/^[1-4]$/.test(e.key)){const b=btns[+e.key-1];if(b)b[0].click()}
  else if(answered&&e.key==="Enter"&&document.activeElement!==$("next")){e.preventDefault();$("next").click()}
});

function result(){
  $("quiz").hidden=true;$("done").hidden=false;
  $("final").innerHTML=`${score}<small> / ${log.length}</small>`;
  const by={};log.forEach(l=>{const c=CATS[l.q.cat];by[c]=by[c]||[0,0];by[c][1]++;if(l.ok)by[c][0]++});
  $("bycat").innerHTML=Object.entries(by).map(([c,[o,t]])=>`<tr><td>${c}</td><td class="n">${o}/${t}</td></tr>`).join("");
  const wrong=log.filter(l=>!l.ok);
  $("wrongCard").hidden=!wrong.length;$("retryWrong").hidden=!wrong.length;
  const ul=$("wrongList");ul.innerHTML="";
  wrong.forEach(l=>{const li=document.createElement("li");
    li.innerHTML=`<div class="ref"></div><div class="wq"></div><div class="wa"></div>`;
    li.children[0].textContent="기준 "+l.q.ref+(l.q.ward?"":" · 참고용");li.children[1].textContent=l.q.q;li.children[2].textContent="→ "+l.q.ans;ul.appendChild(li)});
  window.scrollTo({top:0});
}
$("retryWrong").onclick=()=>start(log.filter(l=>!l.ok).map(l=>l.q),0);
$("home").onclick=home;
function home(){$("quiz").hidden=true;$("done").hidden=true;$("setup").hidden=false;if(mode==="wrong"&&!wrongSet.size)mode="all";renderSetup();window.scrollTo({top:0})}

buildChips();renderSetup();
</script>
</body>
</html>
