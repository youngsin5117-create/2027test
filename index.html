<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>25병동 인증 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone-first column — setup card, then a single question card with four answer buttons and a verdict strip. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#152B2A; --muted:#5B6E6C; --line:#D5DFDD;
  --accent:#1F5F66; --accent-soft:#E3EFEF; --on-accent:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E3F2E8; --bad:#B0442E; --bad-soft:#F8E7E2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1918; --surface:#162322; --ink:#E2ECEA; --muted:#93A6A3; --line:#2A3B3A;
  --accent:#71BCC1; --accent-soft:#1D3433; --on-accent:#0E1918;
  --ok:#6CC892; --ok-soft:#173226; --bad:#EE8D76; --bad-soft:#3A1F19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1918; --surface:#162322; --ink:#E2ECEA; --muted:#93A6A3; --line:#2A3B3A;
  --accent:#71BCC1; --accent-soft:#1D3433; --on-accent:#0E1918;
  --ok:#6CC892; --ok-soft:#173226; --bad:#EE8D76; --bad-soft:#3A1F19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
h1{font-size:24px;line-height:1.25;margin:2px 0 0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:18px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode,.chip,.seg button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px}
.mode{padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-size:14.5px}.mode span{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;font-size:13.5px}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 16px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;padding:12px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted)}
/* quiz */
.bar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.track{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{font-variant-numeric:tabular-nums}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q{font-size:18px;font-weight:600;line-height:1.5;margin:0 0 14px;text-wrap:pretty}
.verdict{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.verdict .v{font-weight:700;font-size:15px}
.verdict.ok .v{color:var(--ok)}.verdict.bad .v{color:var(--bad)}
.verdict .ans{font-size:15.5px;font-weight:600}
.verdict .exp{font-size:13.5px;color:var(--muted)}
/* result */
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--line)}td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrong-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.wrong-list li{border-bottom:1px solid var(--line);padding-bottom:10px}
.wrong-list .wq{font-size:14px}.wrong-list .wa{font-size:13.5px;color:var(--ok);font-weight:600}
@media (max-width:420px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:baseline;gap:8px}}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;font:inherit;font-size:15px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.45}
.opt .k{font-family:var(--mono);font-size:12.5px;flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.opt span:last-child{min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.tag.ref0{background:var(--line);color:var(--muted)}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.toggle small{color:var(--muted)}
.chip.c0 small{font-family:var(--mono)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">5주기 인증 · Q&amp;A Ver.5.1</div>
    <h1>25병동 인증 퀴즈</h1>
    <div class="sub">인증 Q&amp;A 파일의 모든 조사항목을 4지선다로 담았어요. 고르면 바로 정답과 해설이 나옵니다.</div>
  </header>

  <section id="setup" class="card stack">
    <div>
      <div class="label">출제 방식</div>
      <div class="modes" role="group" aria-label="출제 방식">
        <button class="mode" id="m-all" data-mode="all" aria-pressed="true"><b>전체 무작위</b><span id="cnt-all"></span></button>
        <button class="mode" id="m-cat" data-mode="cat" aria-pressed="false"><b>카테고리별</b><span>장별로 골라 풀기</span></button>
        <button class="mode" id="m-wrong" data-mode="wrong" aria-pressed="false"><b>오답 다시</b><span id="cnt-wrong"></span></button>
      </div>
    </div>
    <div id="catBox" hidden>
      <div class="label">카테고리 (여러 개 선택 가능)</div>
      <div class="chips" id="chips"></div>
    </div>
    <label class="toggle" for="incRef"><input type="checkbox" id="incRef" checked> 참고용 항목도 포함 <small>(우리 병동 해당 아님 · <span id="cnt-ref"></span>문제)</small></label>
    <div>
      <div class="label">문제 수</div>
      <div class="seg" role="group" aria-label="문제 수" id="seg">
        <button id="n10" data-n="10" aria-pressed="false">10</button>
        <button id="n20" data-n="20" aria-pressed="true">20</button>
        <button id="n50" data-n="50" aria-pressed="false">50</button>
        <button id="nall" data-n="0" aria-pressed="false">전체</button>
      </div>
    </div>
    <div class="row"><button class="btn" id="start">시작하기</button></div>
    <div class="hint" id="setupHint"></div>
  </section>

  <section id="quiz" hidden class="stack">
    <div class="bar"><span id="pos">1/10</span><div class="track"><i id="prog" style="width:0"></i></div><span class="score" id="sc">0점</span></div>
    <div class="card">
      <div class="meta"><span class="tag" id="qcat"></span><span class="tag ref0" id="qref0" hidden>참고용</span><span class="ref" id="qref"></span></div>
      <p class="q" id="qtext"></p>
      <ol class="opts" id="opts"></ol>
      <div id="result" hidden style="margin-top:12px" class="stack">
        <div class="verdict" id="verdict">
          <div class="v" id="vtext"></div>
          <div class="ans" id="vans"></div>
          <div class="exp" id="vexp"></div>
        </div>
        <div class="row"><button class="btn" id="next" type="button">다음 문제</button></div>
      </div>
    </div>
    <div class="row"><button class="btn quiet" id="quit" type="button">그만 풀고 결과 보기</button></div>
    <div class="hint">키보드: 1~4로 선택, Enter로 다음 문제</div>
  </section>

  <section id="done" hidden class="stack">
    <div class="card stack">
      <div><div class="label">결과</div><div class="big" id="final"></div></div>
      <table id="bycat"></table>
      <div class="row">
        <button class="btn" id="retryWrong" type="button">이번 오답만 다시</button>
        <button class="btn ghost" id="home" type="button">처음으로</button>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <div class="label">틀린 문제</div>
      <ul class="wrong-list" id="wrongList"></ul>
    </div>
  </section>
</div>

<script>
const CATS={1:"1장 환자안전",2:"2장 진료전달·평가",3:"3장 환자진료",4:"4장 의약품",5:"5장 수술·시술·진정",6:"6장 환자권리",7:"7장 질향상·안전보고",8:"8장 감염관리",9:"9~11장 경영·직원·시설"};
// [카테고리, 기준, 병동해당(1)/참고용(0), 문제, 정답, 오답1, 오답2, 오답3, 해설]
const RAW=[
[1,"1.1 ME2",1,"정확한 환자확인에 쓰는 두 가지 지표는?","이름 + 등록번호","이름 + 병실번호","이름 + 진단명","등록번호 + 침상번호","등록번호 확인이 어려우면 이름 + 생년월일"],
[1,"1.1 ME2",1,"등록번호 확인이 어려운 상황에서 이름과 함께 쓰는 지표는?","생년월일","주소","주치의 이름","입원일",""],
[1,"1.1 ME2",1,"환자 이름을 확인하는 올바른 질문은?","\"이름이 어떻게 되십니까?\"","\"홍길동 님 맞으시죠?\"","\"몇 호실 환자분이시죠?\"","\"오늘 시술하시는 분 맞죠?\"","개방형 질문으로 환자가 직접 성명을 말하게 함"],
[1,"1.1 ME2",1,"입원환자 인식팔찌를 제거하는 시점은?","퇴원(전원·사망 포함) 직전","입원 후 24시간","전동 시","퇴원 다음 날",""],
[1,"1.1 ME2",1,"PDA(환자안전시스템) 사용 시 환자확인 방법은?","개방형으로 이름 질문 + 팔찌 바코드 스캔 대조","바코드 스캔만 하면 됨","이름 질문만 하면 됨","침상 이름표만 확인",""],
[1,"1.1 ME2",1,"의식이 명확하지 않은 환자의 확인 방법은?","보호자에게 성명 확인, 보호자가 없으면 환자인식표로 확인","침상 이름표만 확인","확인 생략","동료 간호사에게 확인",""],
[1,"1.1 ME2",1,"환자확인을 반드시 해야 하는 시기가 아닌 것은?","식사 배식 후","의약품 투여 전","수혈 전","검사 시행 전","확인 시기: 투약·수혈·검사·진료/처치/시술 전"],
[1,"1.1 ME2",0,"신생아의 환자인식표 착용 방법은?","손목·발목에 2개","손목에 1개","침상에만 부착","발목에 1개","초미숙아는 한쪽 손목·발목 또는 연결된 센서라인"],
[1,"1.1 ME3",1,"수혈 전 환자확인 방법은?","의료인 2인이 소리 내어 개방형 질문 + 팔찌·출고바코드 대조","간호사 1인이 바코드만 스캔","보호자에게만 확인","혈액은행 직원이 확인","원본 답변 빈칸 → 3.10 ME3 기준 적용"],
[1,"1.1 ME4",0,"외래·검사실 환자의 확인 도구가 아닌 것은?","환자인식팔찌","진료카드","진료·검사 예약증","키오스크 접수증","팔찌는 입원환자용"],
[1,"1.1 ME5",0,"외래 진료·처치·시술 전 환자확인은 몇 가지 지표로 하나?","두 가지","한 가지","세 가지","환자가 원하는 만큼",""],
[1,"1.2 ME2",1,"구두·전화처방이 허용되는 상황은?","수술·시술·응급 등 EMR에 접근할 수 없어 치료에 지장이 있을 때","의사가 바쁠 때","야간 근무 중 언제나","처방 입력이 번거로울 때",""],
[1,"1.2 ME2",1,"구두·전화처방 절차 순서는?","Write down → Read back → Confirm","Read back → Write down → Confirm","Confirm → Write down → Read back","Write down → Confirm","PHIS 구두/전화처방 메모지 사용"],

[1,"1.2 ME2",1,"구두로 처방할 수 있는 검체검사는 몇 종인가?","12종","2종","20종","제한 없음","검체 12종, 영상 2종, 특수 2종"],
[1,"1.2 ME2",1,"약물 구두처방 메모 입력 경로는?","입원간호>처방확인>버튼모음>구두(약)","통합메뉴>위험관리>구두처방","진료공통>약품목록조회","입원간호>인계장","검사는 재료 및 처치등록>버튼모음>구두검사"],
[1,"1.2 ME3",0,"PRN 처방 가능 의약품의 선정·관리 자료를 확인하는 곳은?","약제부(의약품관리 ST)","간호부","적정관리팀","원무팀",""],
[1,"1.2 ME4",1,"PRN 처방에 1일 최대 투여 횟수 명시가 없으면?","1회","2회","3회","제한 없음",""],
[1,"1.2 ME4",1,"진정·마약류 PRN 투여 원칙은?","실시기준 '(보고 후 투여)' — 의사 보고 후 투여","간호사 판단으로 바로 투여","환자가 요청하면 바로 투여","보호자 동의 후 투여",""],
[1,"1.2 ME4",1,"PRN 가능 의약품·검사 목록 조회 경로는?","진료공통>약품목록조회>p.r.n 목록조회","통합메뉴>직무기술서","입원간호>수혈간호기록","그룹웨어 공지사항","PRN 진통제 2개 이상이면 주의사항도 확인"],
[1,"1.2 ME5",1,"처방 의미가 불명확할 때 가장 먼저 할 일은?","모든 절차를 중단하고 처방의에게 확인","추정해서 투여","다음 근무조에 인계","약제부에 맡김",""],

const Q=RAW.map((r,i)=>({id:i,cat:r[0],ref:r[1],ward:!!r[2],q:r[3],ans:r[4],opts:[r[4],r[5],r[6],r[7]],exp:r[8]}));

const KEY="ward25-quiz-mcq-wrong";
function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){return new Set()}}
function saveWrong(s){try{localStorage.setItem(KEY,JSON.stringify([...s]))}catch(e){}}
let wrongSet=loadWrong();

const $=id=>document.getElementById(id);
let mode="all",nPick=20,selCats=new Set(Object.keys(CATS).map(Number));
let deck=[],idx=0,cur=null,score=0,answered=false,log=[],btns=[];

function incRef(){return $("incRef").checked}
function poolFor(){
  let p=Q.filter(q=>incRef()||q.ward);
  if(mode==="wrong") return p.filter(q=>wrongSet.has(q.id));
  if(mode==="cat") return p.filter(q=>selCats.has(q.cat));
  return p;
}
function renderSetup(){
  const base=Q.filter(q=>incRef()||q.ward);
  $("cnt-all").textContent=base.length+"문제";
  $("cnt-ref").textContent=Q.filter(q=>!q.ward).length;
  $("cnt-wrong").textContent=wrongSet.size?wrongSet.size+"문제":"아직 없음";
  $("m-wrong").disabled=!wrongSet.size&&mode!=="wrong";
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("catBox").hidden=mode!=="cat";
  document.querySelectorAll("#chips .chip").forEach(b=>{const k=+b.dataset.k;b.querySelector("small").textContent=base.filter(q=>q.cat===k).length});
  const n=poolFor().length;
  $("start").disabled=!n;
  $("setupHint").textContent=n?`출제 대상 ${n}문제 · 문제와 보기 순서는 매번 섞입니다.`:(mode==="cat"?"카테고리를 하나 이상 고르세요.":"풀 문제가 없어요.");
}
function buildChips(){
  const box=$("chips");
  Object.entries(CATS).forEach(([k,v])=>{
    const b=document.createElement("button");b.className="chip";b.type="button";b.id="cat"+k;b.dataset.k=k;
    b.innerHTML=`${v}<small></small>`;b.setAttribute("aria-pressed",selCats.has(+k));
    b.onclick=()=>{selCats.has(+k)?selCats.delete(+k):selCats.add(+k);b.setAttribute("aria-pressed",selCats.has(+k));renderSetup()};
    box.appendChild(b);
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderSetup()});
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{nPick=+b.dataset.n;document.querySelectorAll("#seg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("incRef").onchange=renderSetup;
$("start").onclick=()=>start(poolFor(),nPick);

function start(pool,n){
  deck=shuffle(pool.slice()); if(n) deck=deck.slice(0,n);
  idx=0;score=0;log=[];
  $("setup").hidden=true;$("done").hidden=true;$("quiz").hidden=false;
  show();window.scrollTo({top:0});
}
function show(){
  cur=deck[idx];answered=false;
  $("pos").textContent=`${idx+1}/${deck.length}`;
  $("prog").style.width=(idx/deck.length*100)+"%";
  $("sc").textContent=score+"점";
  $("qcat").textContent=CATS[cur.cat];
  $("qref0").hidden=cur.ward;
  $("qref").textContent="기준 "+cur.ref;
  $("qtext").textContent=cur.q;
  const ol=$("opts");ol.innerHTML="";btns=[];
  shuffle(cur.opts.slice()).forEach((t,i)=>{
    const li=document.createElement("li");const b=document.createElement("button");
    b.type="button";b.className="opt";b.id="opt"+i;
    b.innerHTML=`<span class="k">${i+1}</span><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>pick(b,t);li.appendChild(b);ol.appendChild(li);btns.push([b,t]);
  });
  $("result").hidden=true;
}
function pick(btn,t){
  if(answered)return;answered=true;
  const ok=t===cur.ans;
  if(ok)score++;
  log.push({q:cur,ok,pick:t});
  if(ok)wrongSet.delete(cur.id);else wrongSet.add(cur.id);saveWrong(wrongSet);
  btns.forEach(([b,tt])=>{b.disabled=true;
    if(tt===cur.ans)b.classList.add("is-ok");else if(b===btn)b.classList.add("is-bad");else b.classList.add("dim")});
  $("verdict").className="verdict "+(ok?"ok":"bad");
  $("vtext").textContent=ok?"정답":"오답";
  $("vans").textContent=ok?cur.ans:"정답: "+cur.ans;
  $("vexp").textContent=cur.exp;$("vexp").hidden=!cur.exp;
  $("result").hidden=false;
  $("sc").textContent=score+"점";
  $("prog").style.width=((idx+1)/deck.length*100)+"%";
  $("next").textContent=idx===deck.length-1?"결과 보기":"다음 문제";
  $("next").focus({preventScroll:true});
  $("result").scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
$("next").onclick=()=>{idx++;idx<deck.length?show():result()};
$("quit").onclick=()=>{log.length?result():home()};
document.addEventListener("keydown",e=>{
  if($("quiz").hidden||e.target.tagName==="INPUT")return;
  if(!answered&&/^[1-4]$/.test(e.key)){const b=btns[+e.key-1];if(b)b[0].click()}
  else if(answered&&e.key==="Enter"&&document.activeElement!==$("next")){e.preventDefault();$("next").click()}
});

function result(){
  $("quiz").hidden=true;$("done").hidden=false;
  $("final").innerHTML=`${score}<small> / ${log.length}</small>`;
  const by={};log.forEach(l=>{const c=CATS[l.q.cat];by[c]=by[c]||[0,0];by[c][1]++;if(l.ok)by[c][0]++});
  $("bycat").innerHTML=Object.entries(by).map(([c,[o,t]])=>`<tr><td>${c}</td><td class="n">${o}/${t}</td></tr>`).join("");
  const wrong=log.filter(l=>!l.ok);
  $("wrongCard").hidden=!wrong.length;$("retryWrong").hidden=!wrong.length;
  const ul=$("wrongList");ul.innerHTML="";
  wrong.forEach(l=>{const li=document.createElement("li");
    li.innerHTML=`<div class="ref"></div><div class="wq"></div><div class="wa"></div>`;
    li.children[0].textContent="기준 "+l.q.ref+(l.q.ward?"":" · 참고용");li.children[1].textContent=l.q.q;li.children[2].textContent="→ "+l.q.ans;ul.appendChild(li)});
  window.scrollTo({top:0});
}
$("retryWrong").onclick=()=>start(log.filter(l=>!l.ok).map(l=>l.q),0);
$("home").onclick=home;
function home(){$("quiz").hidden=true;$("done").hidden=true;$("setup").hidden=false;if(mode==="wrong"&&!wrongSet.size)mode="all";renderSetup();window.scrollTo({top:0})}

buildChips();renderSetup();
</script>
</body>
</html>
